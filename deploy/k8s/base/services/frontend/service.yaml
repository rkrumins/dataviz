apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: synodic
  labels:
    app.kubernetes.io/name: frontend
  annotations:
    cloud.google.com/backend-config: '{"default": "frontend-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: frontend
