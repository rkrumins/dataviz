apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: synodic
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: broker
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: broker
    spec:
      serviceAccountName: synodic-infra
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 2gb
            # volatile-lru: only entries with a TTL are eligible for
            # eviction. Every GraphCache entry sets ``ex=...`` on write,
            # so cache entries get evicted under memory pressure first
            # and aggregation job streams on DB 0 (no TTL) are protected.
            - --maxmemory-policy
            - volatile-lru
          ports:
            - containerPort: 6379
              name: redis
          env:
            # Probe auth (see the FalkorDB StatefulSet for the full note).
            # This instance serves the STREAMS (DB 0) and CACHE (DB 1) roles
            # behind one requirepass, so the streams password is the probe
            # credential. optional + empty-guarded: no-auth deployments are
            # unchanged.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_STREAMS_PASSWORD
                  optional: true
          # Resource asks must allow Redis to actually use the 2 GB
          # maxmemory budget — Kubernetes OOMs the container if it grows
          # past ``limits.memory`` regardless of Redis's own ceiling. The
          # request matches the budget; the limit adds a slack window
          # for transient overhead (fragmentation, replication buffers).
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
            limits:
              cpu: 500m
              memory: 2560Mi
          readinessProbe:
            exec:
              # grep PONG: redis-cli exits 0 even on a NOAUTH/error reply.
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              # LOADING = alive and replaying AOF — do not kill mid-replay.
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -qE 'PONG|LOADING'"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 5Gi
