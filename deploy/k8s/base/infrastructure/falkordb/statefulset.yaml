apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: synodic
  labels:
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/component: graph-database
spec:
  serviceName: falkordb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/component: graph-database
    spec:
      serviceAccountName: synodic-infra
      # 120s: a node drain must leave time for the final AOF fsync + clean
      # shutdown of a multi-GB dataset — SIGKILL at 30s risks a truncated
      # append and a longer (or failed) replay on the next node.
      terminationGracePeriodSeconds: 120
      containers:
        - name: falkordb
          image: REGISTRY/falkordb:latest
          ports:
            - containerPort: 6379
              name: falkordb
            - containerPort: 3000
              name: falkordb-ui
          env:
            # Per-QUERY memory ceiling, split out of FALKORDB_ARGS so an
            # overlay can patch this one value instead of restating the whole
            # args string (kubelet expands $(VAR) from earlier entries in the
            # same container's env list).
            #
            # SIZING — this is charged PER CONCURRENT QUERY, on top of
            # maxmemory, inside the pod limit:
            #
            #   pod_limit >= 1.25*maxmemory + concurrent*1.3*QUERY_MEM_CAPACITY + 256Mi
            #
            # The 1.3 covers the reply buffer: FalkorDB materializes a query's
            # whole result set in the tracked budget and then serializes it
            # into the client reply buffer, which is NOT tracked. See
            # docs/FALKORDB_DEPLOYMENT.md.
            - name: FALKORDB_QUERY_MEM_CAPACITY
              value: "536870912"                       # 512 MiB
            - name: FALKORDB_ARGS
              value: "THREAD_COUNT 4 OMP_THREAD_COUNT 1 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 180000 MAX_QUEUED_QUERIES 64 QUERY_MEM_CAPACITY $(FALKORDB_QUERY_MEM_CAPACITY) CACHE_SIZE 50"
            # The dataset itself needs maxmemory or growth OOM-kills the pod.
            # noeviction = writes fail loudly at the ceiling.
            # save 3600 1 = hourly RDB floor alongside AOF: appendonly-yes with
            # a missing/quarantined appendonlydir boots EMPTY without an RDB
            # base, and engine upgrades must reload from RDB (docs §5c).
            - name: REDIS_ARGS
              value: "--maxmemory 6gb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --aof-load-truncated yes --save 3600 1"
            # Probe auth: redis-cli reads REDISCLI_AUTH natively (never on the
            # command line / in `ps`). optional:true + the empty-guard in the
            # probe wrapper keep unauthenticated deployments byte-for-byte
            # unchanged; set FALKORDB_PASSWORD in app-secrets when REDIS_ARGS
            # gains --requirepass, or every probe replies NOAUTH. (A TLS-only
            # listener would additionally need --tls --cacert <mounted CA> on
            # the probe commands.)
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FALKORDB_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              # 10Gi, not 8Gi: maxmemory alone was booked at 75% of an 8Gi
              # limit, which left the ENTIRE remainder for fragmentation and
              # AOF-rewrite copy-on-write — and nothing for query memory,
              # which is charged separately and concurrently (see the sizing
              # note on FALKORDB_QUERY_MEM_CAPACITY above). 6gb*1.25 + 2
              # concurrent queries at 512Mi*1.3 + 256Mi overhead ~= 9.1Gi.
              # requests stay at 2Gi, so scheduling density is unchanged.
              memory: 10Gi
          readinessProbe:
            exec:
              # grep PONG, not bare `redis-cli ping`: redis-cli exits 0 even on
              # a NOAUTH/error reply, so the bare probe stayed green while every
              # client was rejected. Strict: LOADING/MASTERDOWN take no traffic.
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              # LOADING = alive and replaying its AOF/RDB — killing it here
              # restarts the replay from scratch and the pod NEVER recovers
              # (observed live 2026-07-11 on a 3.9GB AOF: hours of flapping).
              # Readiness stays strict (no traffic while loading).
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -qE 'PONG|LOADING'"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: falkordb-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: falkordb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
