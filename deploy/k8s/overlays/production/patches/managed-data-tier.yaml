# Production managed data tier — Cloud SQL + Memorystore replace the in-cluster
# postgres/redis StatefulSets. FalkorDB stays self-managed on GKE (launch-scale
# spec §7). The operator supplies the private endpoints via .env.deploy; the
# Makefile `apply` target exports them and `envsubst` fills the placeholders:
#
#   DB_HOST            Cloud SQL private IP (or 127.0.0.1 if using the Auth Proxy sidecar)
#   REDIS_COORD_HOST   Memorystore (coordination) private IP
#   REDIS_CACHE_HOST   Memorystore (cache) private IP
#   POSTGRES_PASSWORD  Cloud SQL user password
#
# Prereq: the GKE cluster is VPC-native and has private connectivity to the
# services VPC (required for Memorystore regardless), so Cloud SQL private IP
# and Memorystore IPs are reachable directly — no sidecar needed. To use IAM
# auth / the Cloud SQL Auth Proxy sidecar instead, set DB_HOST=127.0.0.1 and add
# the proxy container; see docs/INFRASTRUCTURE_LAUNCH_SCALE.md §5.
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: synodic
data:
  # Streams (coordination bus) and cache are SEPARATE Memorystore instances,
  # each with its own AUTH password (app-secrets) and its own TLS CA. Nothing
  # is shared between the roles.
  REDIS_STREAMS_HOST: "${REDIS_COORD_HOST}"
  REDIS_STREAMS_PORT: "6379"
  REDIS_STREAMS_DB: "0"
  REDIS_STREAMS_TLS_ENABLED: "${REDIS_STREAMS_TLS_ENABLED}"
  REDIS_STREAMS_TLS_CA_CERTS: "/certs/streams/ca.crt"
  REDIS_CACHE_HOST: "${REDIS_CACHE_HOST}"
  REDIS_CACHE_PORT: "6379"
  REDIS_CACHE_DB: "1"
  REDIS_CACHE_TLS_ENABLED: "${REDIS_CACHE_TLS_ENABLED}"
  REDIS_CACHE_TLS_CA_CERTS: "/certs/cache/ca.crt"
  # Neutralise the legacy URLs so the merged prod ConfigMap carries no stale
  # coordinates (the in-cluster redis Service is $patch:deleted here). Empty =
  # unset to the resolver; the role-prefixed vars above are the only source.
  REDIS_URL: ""
  CACHE_REDIS_URL: ""
  # Cloud SQL Managed Connection Pooling runs transaction-mode pooling → the
  # app must not use server-side prepared statements (backend/app/db/engine.py
  # sets asyncpg statement_cache_size=0 when this is 'transaction').
  DB_POOLER_MODE: "transaction"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: synodic
stringData:
  # Cloud SQL. GRAPHVER_DB_URL is intentionally NOT set — the app falls back to
  # MANAGEMENT_DB_URL (single-instance launch, spec §5.6). To split the versioned
  # store onto a second Cloud SQL later, add GRAPHVER_DB_URL here.
  MANAGEMENT_DB_URL: "postgresql+asyncpg://synodic:${POSTGRES_PASSWORD}@${DB_HOST}:5432/synodic"
---
# ── Remove the in-cluster data stores (replaced by managed services) ──
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: synodic
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: synodic
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: synodic
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: synodic
$patch: delete
