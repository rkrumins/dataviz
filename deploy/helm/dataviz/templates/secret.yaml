{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: dataviz-secrets
  labels:
    {{- include "dataviz.labels" . | nindent 4 }}
type: Opaque
stringData:
  MANAGEMENT_DB_URL: {{ .Values.secrets.managementDbUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  # Retired signing keys (comma-separated, most-recent first), accepted for
  # verification only. Empty = single-key behaviour. Populate during a
  # rotation so live sessions survive the cutover and replicas mid-rollout
  # do not disagree about which tokens are valid.
  JWT_SECRET_KEY_PREVIOUS: {{ .Values.secrets.jwtSecretKeyPrevious | default "" | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ .Values.secrets.credentialEncryptionKey | quote }}
  {{- if .Values.stores.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  # Store AUTH passwords (empty = no auth). Set falkordbPassword together
  # with --requirepass in stores.falkordb.redisArgs (and redisPassword with
  # the redis args): the store probes read these as REDISCLI_AUTH, and the
  # backend reads FALKORDB_PASSWORD / REDIS_STREAMS_PASSWORD for its clients.
  FALKORDB_PASSWORD: {{ .Values.secrets.falkordbPassword | default "" | quote }}
  REDIS_STREAMS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
{{- end }}
