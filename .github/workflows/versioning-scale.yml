# A versioned graph of a million nodes and a million edges, end to end, each step in its own
# process (backend/scripts/bench_versioning.py): a view package is generated, inspected and
# imported into a new graph's draft; the draft is published; the published window is projected
# into FalkorDB; the graph is rebuilt there from nothing; and it is exported.
#
# A step fails the job when it does not complete, when its peak memory passes its ceiling, or
# when FalkorDB and Postgres disagree after it. The ceilings hold at any size: a step that holds a
# page at a time stays under them, and one that starts holding the whole graph again does not.
# docs/versioning/09-scale-limits-and-roadmap.md §2 has what this measured, and how to measure at
# your own size.
#
# It took 35 minutes on a 4-CPU machine, so it runs weekly, on demand (at any size), and on a
# pull request that changes the harness or this file.
name: versioning-scale

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  workflow_dispatch:
    inputs:
      nodes:
        description: Nodes in the generated graph
        default: "1000000"
      edges:
        description: Edges in the generated graph
        default: "1000000"
  pull_request:
    paths:
      - backend/scripts/bench_versioning.py
      - .github/workflows/versioning-scale.yml

concurrency:
  group: versioning-scale-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scale:
    name: A versioned graph of millions, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: synodic
          POSTGRES_PASSWORD: synodic
          POSTGRES_DB: synodic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synodic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      falkordb:
        image: falkordb/falkordb:v4.18.11
        env:
          # As in backend-tests.yml's versioning-e2e: unlimited replies, as every deploy runs it.
          FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE -1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # The coordination bus, on its default port 6380 (6379 is FalkorDB).
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MANAGEMENT_DB_URL: postgresql+asyncpg://synodic:synodic@localhost:5432/synodic
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
      NODES: ${{ inputs.nodes || '1000000' }}
      EDGES: ${{ inputs.edges || '1000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Build the management and graphver schemas
        run: |
          python -m backend.scripts.upgrade upgrade
          python -c "import asyncio; from backend.app.services.versioning import models; asyncio.run(models.create_schema_and_partitions())"
      - name: Generate the graph
        run: python -m backend.scripts.bench_versioning gen-package --nodes "$NODES" --edges "$EDGES" --out "$RUNNER_TEMP/graph.zip"
      - name: Import, publish, project, rebuild and export it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          step() {  # step <name> <run arguments…>: one job, in a process of its own
            name=$1; shift
            python -m backend.scripts.bench_versioning run "$@" --label "$name" \
              --state "$RUNNER_TEMP/state.json" --json "$RUNNER_TEMP/results/$name.json"
          }
          step inspect inspect --package "$RUNNER_TEMP/graph.zip"
          step import import --target empty
          step publish publish
          step project project
          step rebuild project --full
          step export export
      - name: Report
        if: always()
        run: python -m backend.scripts.bench_versioning report --state "$RUNNER_TEMP/state.json" --md "$GITHUB_STEP_SUMMARY"
      - name: Hold each step to its ceiling
        run: |
          python - "$RUNNER_TEMP/results" <<'EOF'
          import json, pathlib, sys
          # Peak memory (MB) each step may reach at any size. A publish holds the Merkle
          # fingerprint's list of changes, up to 1,000,000 entries, besides its page.
          CEILING_MB = {"inspect": 512, "import": 512, "publish": 1024, "project": 512,
                        "rebuild": 512, "export": 512}
          missed = []
          for name, ceiling in CEILING_MB.items():
              m = json.loads((pathlib.Path(sys.argv[1]) / f"{name}.json").read_text())["metrics"]
              print(f"{name}: {m['total_s']:.0f} s, peak {m['rss_peak_mb']:.0f} MB (ceiling {ceiling})")
              if m["rss_peak_mb"] > ceiling:
                  missed.append(f"{name} peaked at {m['rss_peak_mb']:.0f} MB, past {ceiling} MB")
              if m.get("falkor_eq_pg") is False:
                  missed.append(f"{name}: FalkorDB and Postgres disagree")
          if missed:
              sys.exit("\n".join(missed))
          EOF
