apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: viz-service
  namespace: synodic
  labels:
    app.kubernetes.io/name: viz-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: viz-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
