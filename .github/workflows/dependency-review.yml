name: Dependency review

# Scans dependency manifest changes on every PR and fails the check if the
# PR introduces a dependency with a known vulnerability. Free for public
# repos. Complements Dependabot, which watches already-merged dependencies.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
