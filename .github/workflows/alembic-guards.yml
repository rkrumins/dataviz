name: Guards

# Cheap, fast checks for contracts that are invisible until they detonate. Each is pure
# `ast`/`pathlib` parsing — no database, no backend imports, no service containers — so the whole
# workflow needs nothing but pytest, finishes in seconds, and cannot flake.
#
# 1. REVISION IDS. `alembic_version.version_num` is VARCHAR(32). A revision id longer than that
#    fails alembic's own post-migration `UPDATE alembic_version` with StringDataRightTruncation —
#    and because alembic uses transactional DDL, the WHOLE upgrade chain rolls back with it. The
#    symptom is brutal and misleading: a brand-new environment simply cannot be built, while every
#    already-migrated database keeps working fine, so it survives local testing. The guard test has
#    existed since June; the bug still shipped three times, because nothing ran the test.
#
# 2. FEATURE WIRING. The Admin → Features page must not lie about which switches do something,
#    nor the versioned-graph settings registry about the code it describes, nor the guide and the
#    app's catalogue generated from it about the registry.
#
# 3. CONFIGURATION REFERENCE. docs/CONFIGURATION.md is generated from every environment variable
#    the backend reads, by `backend/scripts/export_config_reference.py`. A new setting, a changed
#    default or a moved read changes the page, and the job fails until it is regenerated, so the
#    reference operators configure deployments from cannot drift from the code.
#
# 4. MERGE CHAIN. `merge-chain` fails a merge that would leave a database stamped somewhere
#    upgrading out of order.
#
# All four jobs run on EVERY pull request. They used to be filtered to `backend/alembic/**`, which
# reads as thrift and behaves as a hole: these guards exist precisely to catch the change made
# somewhere else that quietly breaks them.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  revision-ids:
    name: Revision ids fit alembic_version(32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: pip install --disable-pip-version-check pytest pyyaml

      # --noconftest is load-bearing, not tidiness. pytest loads backend/tests/conftest.py for
      # anything under that directory, and that conftest imports the whole app (argon2, FastAPI,
      # SQLAlchemy) — none of which this job installs. So this step exited 4 on a collection
      # error every time it ran: the guard written because "a test nobody runs is a comment" was
      # itself not running. These two tests are pure `ast`/`pathlib` parsing and need no fixtures.
      - name: Every revision id fits the 32-char version_num column
        run: python -m pytest backend/tests/test_alembic_revision_lengths.py -q --noconftest

      # Two PRs green on their own can each add a revision on one parent: merged, the chain has
      # two heads, and until the upgrade Job learned to reach every head, every deploy of main
      # stopped there (#674 and #675). A merge revision joins them; this says when one is due.
      - name: The migration chain ends in one head
        run: python -m pytest backend/tests/test_alembic_single_head.py -q --noconftest

      # The upgrade Job places a database another line of work's build stamped by walking the
      # parents `backend/alembic/other_lines.json` records for it, down to this chain.
      - name: The lineage record is whole, and the merge check holds
        run: python -m pytest backend/tests/test_alembic_lineage.py -q --noconftest

      # The Job's estimate-and-correct recovery is for dev: off by default in every deployment
      # (Helm values, kustomize base and overlays), on in the dev presets and Compose.
      - name: Production stops on an unplaced stamp; dev's presets recover it
        run: python -m pytest backend/tests/test_upgrade_presets.py -q --noconftest

      # Helm's pre-upgrade backup: between the bootstrap and the upgrade, and never blocking a
      # deploy for an older image or nowhere to write.
      - name: The pre-upgrade backup runs where it must
        run: python -m pytest backend/tests/test_helm_backup.py -q --noconftest

      # 3. THE ADDITIVE MIRROR. `init_aggregation_db` and the alembic chain are
      #    two halves of one contract, and the comments in each said "mirrored"
      #    while nothing checked it. `observed_cell_ratio` shipped with a
      #    db_init statement that had lost its `ALTER TABLE` prefix — invalid
      #    SQL, swallowed by the per-statement try/except that keeps start-up
      #    alive — and no migration at all. The baseline create_all()s the
      #    current ORM, so fresh installs had the column and every existing
      #    database did not, while the write path named it in an UPDATE.
      - name: db_init's additive list and the migrations still mirror
        run: python -m pytest backend/tests/test_additive_migrations_mirror.py -q --noconftest

  # A database stamped at a revision is taken to have run everything below it. A merge that drops
  # or re-parents a revision main has, or re-parents one a branch already pushed (and may have
  # deployed), leaves databases stamped there with migrations skipped or stranded — #556's
  # `20260815_1200_announce_poll_60s` was pushed with seven different parents. A migration main
  # has whose file this changes is flagged too: databases that ran it never run the change.
  merge-chain:
    name: A merge keeps every database's place in the migration chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: pr
          fetch-depth: 0                  # every branch's history: what each revision was pushed with
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      # Stdlib only (`ast`, `git`), so there is no install step.
      - name: Main's revisions keep their parents; new ones keep the parents they were pushed with
        working-directory: pr
        run: python -m backend.scripts.check_migration_chain ../base


  feature-wiring:
    name: Every feature flag is really wired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: pip install --disable-pip-version-check pytest

      # The Admin → Features page renders a switch per flag and tells an admin what each one
      # does. For most of the product's life it was lying: eight of the twelve toggles were
      # enforced NOWHERE — turning "Import" off left everyone importing — while the column that
      # was supposed to say so (`implemented`) was an admin-tickable checkbox, i.e. a claim about
      # the source tree owned by people who cannot change the source tree.
      #
      # This test holds `app/config/feature_wiring.py` against the actual tree: a flag that
      # claims a server gate must be read somewhere in backend/app, and one that claims a UI
      # surface must be read somewhere in frontend/src. It needs BOTH trees checked out, which is
      # exactly what a CI job has and the dev container does not (it mounts backend only).
      - name: Declared gates and UI surfaces exist
        run: python -m pytest backend/tests/test_feature_wiring.py -q --noconftest

      # The versioned-graph settings registry (app/config/versioned_graph_settings.py) describes
      # every setting once: the API, the app's catalogue and the guide come from it. This holds its
      # facts to the code (each default to versioning/config.py, each stored value to the policy
      # that stores it today, who may set what) and fails a setting that lacks its explanation.
      # Pure `ast` and the stdlib-only registry, like the test above.
      - name: Every versioned-graph setting is described, and true to the code
        run: python -m pytest backend/tests/test_settings_registry.py -q --noconftest

      # docs/guide/VERSIONED_GRAPH_SETTINGS.md and frontend/src/generated/versionedGraphSettings.json
      # are generated from the registry. On drift it prints the diff and the command that
      # regenerates them.
      - name: The settings guide and catalogue match the registry
        run: python3 backend/scripts/export_settings_reference.py --check

  config-reference:
    name: Configuration reference matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      # Stdlib only (`ast`, `re`), importing nothing from the backend, so there is no install
      # step. On drift it prints the diff and the command that regenerates the page.
      - name: docs/CONFIGURATION.md matches the backend's env reads
        run: python backend/scripts/export_config_reference.py --check
