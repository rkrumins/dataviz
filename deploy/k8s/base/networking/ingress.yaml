apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synodic-ingress
  namespace: synodic
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "synodic-certificate"
    kubernetes.io/ingress.global-static-ip-name: "synodic-ip"
    networking.gke.io/v1beta1.FrontendConfig: "frontend-config"
spec:
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80
  rules:
    - host: synodic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: frontend-config
  namespace: synodic
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
