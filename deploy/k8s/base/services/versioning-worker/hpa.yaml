apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: versioning-transfer
  namespace: synodic
  labels:
    app.kubernetes.io/name: versioning-transfer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: versioning-transfer
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # A pod scaled away mid-job hands its jobs back to another pod, which
    # redoes an import's last window or a whole export: wait out 15 quiet
    # minutes before shrinking.
    scaleDown:
      stabilizationWindowSeconds: 900
