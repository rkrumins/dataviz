apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: synodic
data:
  GRAPH_PROVIDER: "falkordb"
  FALKORDB_HOST: "falkordb"
  FALKORDB_PORT: "6379"
  FALKORDB_GRAPH_NAME: "nexus_lineage"
  # ── FalkorDB topology / TLS knobs (env-default instance) ──────────
  # Uncomment as needed; provider rows override per-provider via
  # extra_config.falkordbConnection. The graph AUTH password rides
  # app-secrets (FALKORDB_PASSWORD), never this ConfigMap.
  # FALKORDB_MODE: "standalone"              # standalone | sentinel | cluster
  # FALKORDB_SENTINEL_MASTER: "mymaster"
  # FALKORDB_SENTINEL_NODES: "s1:26379,s2:26379,s3:26379"
  # FALKORDB_CLUSTER_NODES: "n1:6379,n2:6379,n3:6379"
  # FALKORDB_TLS_ENABLED: "true"
  # FALKORDB_TLS_CA_CERTS: "/certs/falkordb/ca.crt"
  # FALKORDB_SENTINEL_TLS_ENABLED: "true"    # absent → inherit data-plane TLS
  # FALKORDB_ADDRESS_REMAP: "announced:6379=reachable:6379"  # cross-cluster
  # The FalkorDB server's TIMEOUT_MAX (ms). MUST match the TIMEOUT_MAX in
  # the FalkorDB statefulset's FALKORDB_ARGS (base: 180000) — the backend
  # clamps every per-query timeout it sends to this value, because the
  # server REJECTS (never runs) a query requesting more. A mismatch in
  # either direction silently breaks long-budget work (e.g. the insights
  # top-level materialization for very large graphs).
  FALKORDB_SERVER_TIMEOUT_MAX_MS: "180000"
  REDIS_URL: "redis://redis:6379/0"
  # Dedicated cache Redis for the FalkorDB provider's ancestor chain
  # and URN-label caches. Must point at a Redis instance that is NOT
  # the FalkorDB server itself, so a graph outage does not also wipe
  # caching/state. DB index 1 segregates this traffic from REDIS_URL
  # (DB 0) on the same dedicated Redis service.
  CACHE_REDIS_URL: "redis://redis:6379/1"
  LOG_LEVEL: "INFO"
  DB_POOL_TIMEOUT_SECS: "10"
  DB_POOL_RECYCLE_SECS: "1800"
  DB_POOL_PRE_PING: "true"
  DB_CONNECT_TIMEOUT_SECS: "5"
  DB_STARTUP_RETRY_TIMEOUT_SECS: "60"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY_MINUTES: "15"
