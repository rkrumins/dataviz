apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
  namespace: synodic
  labels:
    app.kubernetes.io/name: stats-service
    app.kubernetes.io/component: worker
spec:
  # Background poller + purge worker (built from backend/Dockerfile.insights).
  # Health-only port 8092, no Service. Scale horizontally — per-source Redis
  # SET NX dedup guarantees at-most-one pending poll per data source.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stats-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stats-service
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: synodic-backend
      # Drain in-flight polls on rollout/scale-down instead of SIGKILL at 30s.
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Do NOT gate on postgres/redis: in production those are managed
              # endpoints (Cloud SQL / Memorystore) and the in-cluster Services
              # are deleted by the managed-data-tier patch — an nc -z against
              # those names deadlocks every rescheduled pod in Init. The backend
              # retries the DB at startup and connects to Redis lazily.
              # The control plane runs the aggregation-schema migrations the
              # poller/purge paths depend on — wait for it to be serving.
              echo "Waiting for aggregation-controlplane..."
              until nc -z aggregation-controlplane 8091; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: stats-service
          image: REGISTRY/stats-service:latest
          ports:
            - containerPort: 8092
              name: health
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
            # Decrypt pinned encrypted provider credentials (purge path).
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CREDENTIAL_ENCRYPTION_KEY
            # WS2.3: token for the post-purge re-aggregation trigger to the
            # control plane. optional:true so a missing key never blocks
            # startup (trigger then sends no header; control plane must also
            # be tokenless in that case).
            - name: AGGREGATION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AGGREGATION_INTERNAL_TOKEN
                  optional: true
            # Right-size the Postgres pools for a concurrency-2 worker — the
            # engine defaults are web-tier-tuned (~27 peak conns).
            - name: DB_JOBS_POOL_SIZE
              value: "4"
            - name: DB_JOBS_POOL_MAX_OVERFLOW
              value: "2"
            - name: DB_READONLY_POOL_SIZE
              value: "3"
            - name: DB_READONLY_POOL_MAX_OVERFLOW
              value: "2"
            - name: REDIS_STREAMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_STREAMS_PASSWORD
                  optional: true
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_CACHE_PASSWORD
                  optional: true
          volumeMounts:
            - name: redis-streams-certs
              mountPath: /certs/streams
              readOnly: true
            - name: redis-cache-certs
              mountPath: /certs/cache
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8092
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8092
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8092
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: redis-streams-certs
          secret:
            secretName: redis-streams-certs
            optional: true
        - name: redis-cache-certs
          secret:
            secretName: redis-cache-certs
            optional: true
