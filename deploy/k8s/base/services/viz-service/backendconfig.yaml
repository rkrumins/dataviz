apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: viz-service-backendconfig
  namespace: synodic
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/v1/health/ready
    port: 8000
  # Margin over the backend's slowest ASGI tier (versioning, 120s) so the
  # app's own JSON 504 always wins the race, never an opaque load-balancer
  # 504. The base ingress routes everything through the frontend (whose
  # BackendConfig already carries 180); this keeps a direct-to-API route
  # from reintroducing the tie.
  timeoutSec: 180
  connectionDraining:
    drainingTimeoutSec: 30
