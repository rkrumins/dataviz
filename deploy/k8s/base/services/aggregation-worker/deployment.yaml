apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-worker
  namespace: synodic
  labels:
    app.kubernetes.io/name: aggregation-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aggregation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aggregation-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z postgres 5432; do sleep 2; done
              echo "Waiting for redis..."
              until nc -z redis 6379; do sleep 2; done
              echo "Waiting for falkordb..."
              until nc -z falkordb 6379; do sleep 2; done
              echo "Waiting for aggregation-controlplane..."
              until nc -z aggregation-controlplane 8091; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: aggregation-worker
          image: REGISTRY/synodic-worker:latest
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: worker-config
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
