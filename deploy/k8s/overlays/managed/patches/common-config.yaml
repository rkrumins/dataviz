apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: synodic
data:
  # Sidecars expose Memorystore on the pod's loopback. db 0 for the job
  # dispatcher, db 1 for the FalkorDB provider's chain / URN cache.
  REDIS_URL: "redis://127.0.0.1:6379/0"
  CACHE_REDIS_URL: "redis://127.0.0.1:6379/1"
