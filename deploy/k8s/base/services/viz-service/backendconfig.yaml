apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: viz-service-backendconfig
  namespace: synodic
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/v1/health/ready
    port: 8000
  # The load balancer's limit on a whole response. An hour, so a streamed
  # export can finish (see the frontend's BackendConfig, which the base
  # ingress routes everything through); the app's own tiers (120s at most)
  # still end every other request first, with its JSON 504.
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
