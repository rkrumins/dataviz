apiVersion: apps/v1
kind: Deployment
metadata:
  name: viz-service
  namespace: synodic
  labels:
    app.kubernetes.io/name: viz-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: viz-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viz-service
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Do NOT gate on postgres/redis: in production those are managed
              # endpoints (Cloud SQL / Memorystore) and the in-cluster Services
              # are deleted by the managed-data-tier patch — an nc -z against
              # those names deadlocks every rescheduled pod in Init. The backend
              # retries the DB at startup and connects to Redis lazily, so
              # ordered startup is not required.
              # WS1.1 decoupling: do NOT gate startup on FalkorDB — viz connects
              # lazily and fast-fails while the graph is down/loading, so a graph
              # blip must not block new pods from starting (HPA / rollout /
              # reschedule) exactly when capacity is needed.
              echo "Waiting for aggregation-controlplane..."
              until nc -z aggregation-controlplane 8091; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: viz-service
          image: REGISTRY/viz-service:latest
          # R-M2: drain endpoints before SIGTERM reaches uvicorn — avoids the
          # kube-proxy/LB deregistration race that 502s in-flight requests on
          # every rollout / HPA scale-down / pod reschedule.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: viz-config
            - secretRef:
                name: app-secrets
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
            - name: CORS_ALLOWED_ORIGINS
              value: "https://synodic.example.com"
          volumeMounts:
            - name: redis-streams-certs
              mountPath: /certs/streams
              readOnly: true
            - name: redis-cache-certs
              mountPath: /certs/cache
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: redis-streams-certs
          secret:
            secretName: redis-streams-certs
            optional: true
        - name: redis-cache-certs
          secret:
            secretName: redis-cache-certs
            optional: true
