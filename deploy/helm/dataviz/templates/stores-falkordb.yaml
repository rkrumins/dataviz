{{- if .Values.stores.falkordb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: falkordb
  labels:
    {{- include "dataviz.labels" . | nindent 4 }}
    app.kubernetes.io/name: falkordb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: ui
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  labels:
    {{- include "dataviz.labels" . | nindent 4 }}
    app.kubernetes.io/name: falkordb
spec:
  serviceName: falkordb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/part-of: dataviz
    spec:
      containers:
        - name: falkordb
          image: {{ .Values.stores.falkordb.image | quote }}
          env:
            - name: FALKORDB_ARGS
              value: {{ .Values.stores.falkordb.args | quote }}
            - name: REDIS_ARGS
              value: {{ .Values.stores.falkordb.redisArgs | quote }}
            # Probe auth: when redisArgs sets --requirepass, the probes need
            # the same password or every probe replies NOAUTH. redis-cli reads
            # REDISCLI_AUTH natively; optional + empty-guarded, so no-auth
            # deployments are unchanged. (A TLS-only listener would also need
            # --tls --cacert on the probe commands.)
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "dataviz-secrets" }}
                  key: FALKORDB_PASSWORD
                  optional: true
          ports:
            - name: redis
              containerPort: 6379
            - name: ui
              containerPort: 3000
          readinessProbe:
            exec:
              # grep PONG: redis-cli exits 0 even on a NOAUTH/error reply.
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              # LOADING = alive and replaying AOF/RDB — do not kill mid-replay.
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -qE 'PONG|LOADING'"]
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
          resources:
            {{- toYaml .Values.stores.falkordb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.stores.falkordb.storage | quote }}
{{- end }}
