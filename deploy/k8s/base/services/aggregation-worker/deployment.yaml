apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-worker
  namespace: synodic
  labels:
    app.kubernetes.io/name: aggregation-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aggregation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aggregation-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Do NOT gate on postgres/redis: in production those are managed
              # endpoints (Cloud SQL / Memorystore) and the in-cluster Services
              # are deleted by the managed-data-tier patch — an nc -z against
              # those names deadlocks every rescheduled pod in Init. The backend
              # retries the DB at startup and connects to Redis lazily.
              # WS1.1 decoupling: do NOT gate startup on FalkorDB — the worker
              # connects lazily and fast-fails while the graph is down/loading.
              echo "Waiting for aggregation-controlplane..."
              until nc -z aggregation-controlplane 8091; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: aggregation-worker
          image: REGISTRY/aggregation-worker:latest
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: worker-config
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
            # R-M3: decrypt pinned encrypted provider credentials (multi-instance).
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CREDENTIAL_ENCRYPTION_KEY
            - name: REDIS_STREAMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_STREAMS_PASSWORD
                  optional: true
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_CACHE_PASSWORD
                  optional: true
          volumeMounts:
            - name: redis-streams-certs
              mountPath: /certs/streams
              readOnly: true
            - name: redis-cache-certs
              mountPath: /certs/cache
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: redis-streams-certs
          secret:
            secretName: redis-streams-certs
            optional: true
        - name: redis-cache-certs
          secret:
            secretName: redis-cache-certs
            optional: true
