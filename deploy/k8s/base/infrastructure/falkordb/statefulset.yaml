apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: synodic
  labels:
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/component: graph-database
spec:
  serviceName: falkordb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/component: graph-database
    spec:
      serviceAccountName: synodic-infra
      terminationGracePeriodSeconds: 30
      containers:
        - name: falkordb
          image: REGISTRY/synodic-falkordb:latest
          ports:
            - containerPort: 6379
              name: falkordb
            - containerPort: 3000
              name: falkordb-ui
          env:
            - name: FALKORDB_ARGS
              value: "THREAD_COUNT 4"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: falkordb-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: falkordb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
