apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb-shard-2
  namespace: synodic
  labels:
    app.kubernetes.io/name: falkordb-shard-2
    app.kubernetes.io/part-of: falkordb-cluster
    app.kubernetes.io/component: graph-database
spec:
  serviceName: falkordb-cluster
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb-shard-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb-shard-2
        app.kubernetes.io/part-of: falkordb-cluster
        app.kubernetes.io/component: graph-database
    spec:
      serviceAccountName: synodic-infra
      priorityClassName: falkordb-cluster
      terminationGracePeriodSeconds: 300
      nodeSelector:
        dedicated: falkordb
      tolerations:
        - key: dedicated
          operator: Equal
          value: falkordb
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: falkordb-cluster
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: falkordb-shard-2
      containers:
        - name: falkordb
          image: REGISTRY/falkordb:latest
          command:
            - sh
            - -c
            - |
              if [ -f /data/nodes.conf ] && awk '/myself,master/ && NF > 8 { found = 1 } END { exit !found }' /data/nodes.conf; then
                echo "nodes.conf: this node was a master owning slots; holding 45s so its replica is promoted before this dataset rejoins"
                trap 'exit 0' TERM
                sleep 45 & wait $!
                trap - TERM
              fi
              rm -f /data/temp-*.rdb
              exec /var/lib/falkordb/bin/run.sh
          ports:
            - containerPort: 6379
              name: falkordb
            - containerPort: 16379
              name: cluster-bus
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FALKORDB_DATA_PATH
              value: /data
            - name: FALKORDB_ARGS
              value: "THREAD_COUNT 6 OMP_THREAD_COUNT 1 CACHE_SIZE 40 QUERY_MEM_CAPACITY 1073741824 TIMEOUT_MAX 120000 TIMEOUT_DEFAULT 30000 MAX_QUEUED_QUERIES 150 EFFECTS_THRESHOLD 0 VKEY_MAX_ENTITY_COUNT 100000000 DELAY_INDEXING yes"
            - name: REDIS_ARGS
              value: >-
                --cluster-enabled yes
                --cluster-config-file /data/nodes.conf
                --cluster-node-timeout 15000
                --cluster-require-full-coverage no
                --cluster-migration-barrier 1
                --cluster-allow-replica-migration no
                --cluster-announce-hostname $(POD_NAME).falkordb-cluster.synodic.svc.cluster.local
                --cluster-preferred-endpoint-type hostname
                --maxmemory 28gb
                --maxmemory-policy noeviction
                --appendonly no
                --save 21600 1
                --shutdown-on-sigterm save
                --replica-lazy-flush yes
                --lazyfree-lazy-server-del yes
                --repl-backlog-size 4gb
                --repl-diskless-sync yes
                --repl-timeout 300
                --client-output-buffer-limit replica 4gb 0 0
                --replica-full-sync-buffer-limit 4gb
            # Probe auth: redis-cli reads REDISCLI_AUTH natively. optional +
            # empty-guarded so unauthenticated shards are unchanged; set
            # FALKORDB_PASSWORD in app-secrets when REDIS_ARGS gains
            # --requirepass/--masterauth.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FALKORDB_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: "7"
              memory: 56Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "7"
              memory: 56Gi
              ephemeral-storage: 8Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -qE 'PONG|LOADING'"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  [ -n "$REDISCLI_AUTH" ] || unset REDISCLI_AUTH
                  redis-cli ping 2>/dev/null | grep -q PONG || exit 1
                  INFO=`redis-cli info replication 2>/dev/null`
                  echo "$INFO" | grep -q '^role:master' || echo "$INFO" | grep -q '^master_link_status:up'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -qE 'PONG|LOADING'"]
