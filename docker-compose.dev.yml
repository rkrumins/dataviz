# ══════════════════════════════════════════════════════════════════════
# Synodic — Dev Overlay
# ══════════════════════════════════════════════════════════════════════
#
# Merges with docker-compose.yml to add bind-mounted source and hot-reload
# to the app services. Infra (postgres / redis / falkordb) is inherited
# unchanged — the explicit `name:` on volumes below just pins the dev
# data to separate Docker volumes so a dev stack cannot clobber a prod
# stack that happens to share the host.
#
# Usage:
#   docker compose --env-file .env.dev \
#     -f docker-compose.yml -f docker-compose.dev.yml up -d
# (or just `./dev.sh up`)
# ══════════════════════════════════════════════════════════════════════

name: synodic-dev

services:

  # Infra — stable container names so `docker exec synodic-postgres-dev …`
  # and the preflight library work without guessing the compose-generated
  # name. Safe because this stack is always project `synodic-dev`.
  postgres:
    container_name: synodic-postgres-dev

  redis:
    container_name: synodic-redis-dev
    # Dev cache: disable AOF. The continuously-appended AOF incr file gets
    # truncated (→ crash-loop on startup) whenever the Docker disk fills up.
    # RDB snapshots stay on (atomic write, restart-safe) so cached data still
    # survives normal restarts. `command:` replaces the base, so the maxmemory
    # flags from docker-compose.yml are repeated here.
    #
    # entrypoint: RDB snapshots can still land corrupted (zeroed header) if
    # the disk fills mid-write. redis-dev-entrypoint.sh quarantines a
    # corrupt dump.rdb before redis-server starts, so the container
    # self-heals on every restart instead of crash-looping forever.
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/redis-dev-entrypoint.sh"]
    volumes:
      - ./scripts/redis-dev-entrypoint.sh:/docker-entrypoint.d/redis-dev-entrypoint.sh:ro
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-lru}

  falkordb:
    container_name: synodic-falkordb-dev
    # Dev self-heal: FalkorDB's AOF *incremental* is an engine-version-locked
    # binary GRAPH.EFFECT opcode stream; replaying an incr written by an OLDER
    # engine after an image bump NULL-derefs -> SIGSEGV during startup AOF load,
    # and `restart: unless-stopped` loops forever (the RDB base is portable, the
    # incr is not). The entrypoint arms a crash marker before starting redis and
    # clears it at ready; after two pre-ready deaths it quarantines the incr +
    # resets the manifest to the base RDB so the next boot loads clean. NO-OP on
    # healthy boots. Mirrors the redis service's self-heal entrypoint.
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/falkordb-dev-entrypoint.sh"]
    volumes:
      - ./scripts/falkordb-dev-entrypoint.sh:/docker-entrypoint.d/falkordb-dev-entrypoint.sh:ro

  viz-service:
    # WS1.3: dev runs the SAME spec as prod. The base sets SYNODIC_ROLE=web
    # (stateless) + AGGREGATION_PROXY_ENABLED=true (proxy to the control
    # plane), and dev inherits both — so the dev web tier runs NO background
    # loops either: the aggregation-controlplane container owns
    # scheduler/reconciler/state-sync and the worker containers execute jobs,
    # exactly like production. The only dev deltas are the bind mount and a
    # gunicorn --reload command — the SAME gunicorn/UvicornWorker as prod
    # (2 workers instead of 4), with the poll-based reloader so file-watching
    # works over the macOS bind mount. Running multi-worker locally surfaces
    # per-replica bugs (shared module state, duplicate loops) before prod.
    volumes:
      - ./backend:/app/backend
    command:
      - gunicorn
      - backend.app.main:app
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --workers
      - "2"
      - --bind
      - 0.0.0.0:8000
      - --reload
      - --reload-engine
      - poll
      - --timeout
      - "120"
      - --graceful-timeout
      - "30"

  aggregation-controlplane:
    volumes:
      - ./backend:/app/backend
    # No --reload: the controlplane is a plain `python -m ...` entry
    # point, not a uvicorn app we can hand --reload to. On code change
    # run:  ./dev.sh restart aggregation-controlplane

  aggregation-worker:
    volumes:
      - ./backend:/app/backend
    # Same: `./dev.sh restart aggregation-worker` picks up changes.

  versioning-worker:
    volumes:
      - ./backend:/app/backend
    # Headless projection worker (WS1.1). Pick up code changes with:
    #   ./dev.sh restart versioning-worker

  stats-service:
    volumes:
      - ./backend:/app/backend
    # No --reload (headless process, not a uvicorn app). Pick up
    # code changes with:  ./dev.sh restart stats-service

  frontend:
    build:
      target: development
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    ports:
      # Override prod's 3080:80 with vite's 5173:5173
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - ./docs:/docs:ro
      # Docs site also renders the repo-root changelog (@root alias) —
      # needs its own mount since only ./docs is otherwise visible.
      - ./CHANGELOG.md:/CHANGELOG.md:ro
      # Anonymous volume shadows host's node_modules (if any) so the
      # container's Linux-built modules win over whatever npm install
      # placed on macOS.
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://viz-service:8000

volumes:
  # Override the auto-prefixed names (synodic-dev_postgres_data etc.) with
  # stable explicit names. Keeps existing dev volumes in-place across
  # the 780-line-dev.sh → overlay migration.
  postgres_data:
    name: synodic-postgres-dev-data
  redis_data:
    name: synodic-redis-dev-data
  falkordb_data:
    name: synodic-falkordb-dev-data
