apiVersion: apps/v1
kind: Deployment
metadata:
  name: viz-service
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: viz-service
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # One core per gunicorn worker (GUNICORN_WORKERS=4). At 2 the
              # four single-threaded async workers contend for two cores and
              # CFS-throttle under exactly the concurrent load they exist to
              # absorb — and a throttled worker's event loop stalls every
              # request on it, which reads downstream as provider slowness.
              cpu: "4"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-controlplane
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: controlplane
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-worker
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
