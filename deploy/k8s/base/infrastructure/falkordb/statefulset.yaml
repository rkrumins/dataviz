apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: synodic
  labels:
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/component: graph-database
spec:
  serviceName: falkordb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/component: graph-database
    spec:
      serviceAccountName: synodic-infra
      terminationGracePeriodSeconds: 30
      containers:
        - name: falkordb
          image: REGISTRY/synodic-falkordb:latest
          ports:
            - containerPort: 6379
              name: falkordb
            - containerPort: 3000
              name: falkordb-ui
          env:
            - name: FALKORDB_ARGS
              value: "THREAD_COUNT 4 OMP_THREAD_COUNT 1 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 180000 MAX_QUEUED_QUERIES 64 QUERY_MEM_CAPACITY 536870912 CACHE_SIZE 50"
            # Instance ceiling at 75% of the 8Gi pod limit: QUERY_MEM_CAPACITY
            # bounds one query; the dataset itself needs maxmemory or growth
            # OOM-kills the pod. noeviction = writes fail loudly at the ceiling.
            - name: REDIS_ARGS
              value: "--maxmemory 6gb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --aof-load-truncated yes"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: falkordb-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: falkordb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
