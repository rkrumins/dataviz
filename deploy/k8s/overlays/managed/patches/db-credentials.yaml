# Override the Postgres host in MANAGEMENT_DB_URL. Other keys (user,
# password placeholder, dbname) are merged in from the base. Run the
# combined output through envsubst (POSTGRES_PASSWORD) before applying.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: synodic
type: Opaque
stringData:
  MANAGEMENT_DB_URL: "postgresql+asyncpg://synodic:${POSTGRES_PASSWORD}@127.0.0.1:5432/synodic"
