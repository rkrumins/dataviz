name: build-images

# Builds and pushes the dataviz container images to Docker Hub.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
on:
  push:
    branches:
      - claude/kubernetes-gke-helm-setup-H0dfz
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      org:
        description: "Docker Hub org/namespace"
        required: false
        default: "synodic"
      tag:
        description: "Image tag (default: git tag on tag builds, else 'latest')"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: viz-service
            dockerfile: backend/Dockerfile.viz
          - name: graph-service
            dockerfile: backend/Dockerfile.graph
          - name: aggregation-controlplane
            dockerfile: backend/Dockerfile.controlplane
          - name: aggregation-worker
            dockerfile: backend/Dockerfile.aggregation
          - name: stats-service
            dockerfile: backend/Dockerfile.insights
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: seed
            dockerfile: backend/Dockerfile.seed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Resolve org and tag
        id: meta
        run: |
          ORG="${{ github.event.inputs.org }}"
          [ -z "$ORG" ] && ORG="synodic"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="latest"
            fi
          fi
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build + load locally so Trivy can scan the image before it is pushed.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: docker.io/${{ steps.meta.outputs.org }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: fail the build on fixable HIGH/CRITICAL vulns before pushing.
      - name: Scan ${{ matrix.name }} image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: docker.io/${{ steps.meta.outputs.org }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push ${{ matrix.name }}
        run: docker push docker.io/${{ steps.meta.outputs.org }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
