apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: synodic
type: Opaque
stringData:
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY}"
  ADMIN_EMAIL: "${ADMIN_EMAIL}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  # WS2.3: shared secret for control-plane internal auth. Envsubst leaves it
  # EMPTY when unset at deploy time -> the control plane runs with auth
  # disabled (still functional). Set it to enforce service-to-service auth.
  AGGREGATION_INTERNAL_TOKEN: "${AGGREGATION_INTERNAL_TOKEN}"
  # Streams and cache Redis AUTH passwords. Envsubst leaves these EMPTY when
  # unset at deploy time -> the resolver treats an empty password as no-auth
  # (dev/staging Redis runs unauthenticated). Set for a managed/authenticated
  # instance (see overlays/production/patches/managed-data-tier.yaml).
  REDIS_STREAMS_PASSWORD: "${REDIS_STREAMS_PASSWORD}"
  REDIS_CACHE_PASSWORD: "${REDIS_CACHE_PASSWORD}"
