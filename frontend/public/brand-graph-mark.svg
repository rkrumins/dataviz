<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      /* Graph constellation that assembles itself — edges draw in, nodes pulse
         on a stagger. CSS animation inside an SVG runs when the file is loaded
         via &lt;img&gt; (the logo) and degrades to a clean static mark where
         animation is disabled (favicons, reduced-motion). */
      .e { stroke:#fff; stroke-width:2.4; stroke-linecap:round; fill:none;
           stroke-dasharray:40; stroke-dashoffset:40;
           animation: bgm-draw 2.4s ease-in-out infinite; }
      .e2 { animation-delay:.3s } .e3 { animation-delay:.6s }
      .e4 { animation-delay:.9s } .e5 { animation-delay:1.2s }
      .n { fill:#fff; transform-box:fill-box; transform-origin:center;
           animation: bgm-pulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay:.3s } .n3 { animation-delay:.6s } .n4 { animation-delay:.9s }
      .halo { fill:#fff; transform-box:fill-box; transform-origin:center;
              animation: bgm-halo 2.4s ease-in-out infinite; }
      @keyframes bgm-draw {
        0%   { stroke-dashoffset:40; opacity:.25 }
        45%  { stroke-dashoffset:0;  opacity:.95 }
        75%  { stroke-dashoffset:0;  opacity:.95 }
        100% { stroke-dashoffset:40; opacity:.25 }
      }
      @keyframes bgm-pulse { 0%,100% { transform:scale(.7); opacity:.55 } 50% { transform:scale(1.15); opacity:1 } }
      @keyframes bgm-halo  { 0%,100% { transform:scale(.6); opacity:.15 } 50% { transform:scale(1.3); opacity:.4 } }
      @media (prefers-reduced-motion: reduce) {
        .e { animation:none; stroke-dashoffset:0; opacity:.95 }
        .n { animation:none; opacity:1 } .halo { animation:none; opacity:.25 }
      }
    </style>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <line class="e e1" x1="32" y1="18" x2="18" y2="34"/>
  <line class="e e2" x1="32" y1="18" x2="46" y2="34"/>
  <line class="e e3" x1="18" y1="34" x2="32" y2="50"/>
  <line class="e e4" x1="46" y1="34" x2="32" y2="50"/>
  <line class="e e5" x1="18" y1="34" x2="46" y2="34"/>
  <circle class="halo" cx="32" cy="18" r="8"/>
  <circle class="n n1" cx="32" cy="18" r="4"/>
  <circle class="n n2" cx="18" cy="34" r="4"/>
  <circle class="n n3" cx="46" cy="34" r="4"/>
  <circle class="n n4" cx="32" cy="50" r="4"/>
</svg>
