apiVersion: v1
kind: Service
metadata:
  name: falkordb
  namespace: synodic
  labels:
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/component: graph-database
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: falkordb
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: falkordb-ui
  selector:
    app.kubernetes.io/name: falkordb
