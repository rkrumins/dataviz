apiVersion: v1
kind: ConfigMap
metadata:
  name: viz-config
  namespace: synodic
data:
  SYNODIC_ROLE: "web"
  AGGREGATION_PROXY_ENABLED: "true"
  AGGREGATION_SERVICE_URL: "http://aggregation-controlplane:8091"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: "lax"
  FALKORDB_SOCKET_TIMEOUT: "10"
  # WS1.1/L1: projection is delegated to the versioning-worker Deployment; the
  # web tier must NOT host the in-process projector (its CPU-bound full-seed
  # build would wedge the event loop and freeze every request). Explicit here
  # so the topology never depends on a code default flipping.
  GRAPHVER_PROJECTION_INPROCESS: "0"
  # R-C3: keep the isolated GRAPH_READ pool modest so the per-pod Postgres
  # ceiling (~85 conns/process × GUNICORN_WORKERS × replicas) stays bounded.
  # A single Postgres max_connections cannot cover an HPA'd fleet — front it
  # with PgBouncer (transaction pooling) for real scale.
  DB_GRAPH_READ_POOL_SIZE: "8"
  DB_GRAPH_READ_MAX_OVERFLOW: "8"
  # The grid every analytics window ends on. The warmer itself is
  # controlplane-only, but this tier reads the same variable to decide which
  # epoch it is asking for, so it MUST match controlplane-config's value —
  # otherwise every read misses the warmed entry and rebuilds on demand.
  # PRODUCT_EVENT_RETENTION_DAYS is deliberately absent: the sweep does not
  # run on this role, and setting it here would only imply it did.
  ANALYTICS_WARM_INTERVAL_SECONDS: "300"
