# FalkorDB Redis Cluster: 6 nodes (3 masters + 3 replicas) with auth.
# Uses host networking so the cluster announces 127.0.0.1:700X and host clients
# (and the redis-cli init) can follow MOVED redirects. LINUX ONLY (host net);
# on Docker Desktop run the nodes with published ports + cluster-announce-ip set
# to your host IP instead.
#
#   docker compose -f deploy/topologies/docker-compose.falkordb-cluster.yml up -d
#   # the `cluster-init` one-shot forms the cluster; check it:
#   docker compose -f deploy/topologies/docker-compose.falkordb-cluster.yml logs cluster-init
#
# Integration test env:
#   FALKORDB_TEST_MODE=cluster \
#   FALKORDB_TEST_CLUSTER_NODES=127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002 \
#   FALKORDB_TEST_PASSWORD=testpass \
#   pytest backend/tests/integration/test_topologies.py -v
#
# For TLS add the --tls-* args (see the standalone file) plus
# --tls-cluster yes to each node, and create with `redis-cli --tls ...`.
x-node: &node
  image: falkordb/falkordb:v4.18.11
  restart: unless-stopped
  network_mode: host

services:
  node-0:
    <<: *node
    environment:
      REDIS_ARGS: "--port 7000 --cluster-enabled yes --cluster-config-file nodes-7000.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --requirepass testpass --masterauth testpass --appendonly no"
  node-1:
    <<: *node
    environment:
      REDIS_ARGS: "--port 7001 --cluster-enabled yes --cluster-config-file nodes-7001.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --requirepass testpass --masterauth testpass --appendonly no"
  node-2:
    <<: *node
    environment:
      REDIS_ARGS: "--port 7002 --cluster-enabled yes --cluster-config-file nodes-7002.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --requirepass testpass --masterauth testpass --appendonly no"
  node-3:
    <<: *node
    environment:
      REDIS_ARGS: "--port 7003 --cluster-enabled yes --cluster-config-file nodes-7003.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --requirepass testpass --masterauth testpass --appendonly no"
  node-4:
    <<: *node
    environment:
      REDIS_ARGS: "--port 7004 --cluster-enabled yes --cluster-config-file nodes-7004.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --requirepass testpass --masterauth testpass --appendonly no"
  node-5:
    <<: *node
    environment:
      REDIS_ARGS: "--port 7005 --cluster-enabled yes --cluster-config-file nodes-7005.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --requirepass testpass --masterauth testpass --appendonly no"

  # One-shot: wait for the nodes, then form the cluster (3 masters + 3 replicas).
  cluster-init:
    image: falkordb/falkordb:v4.18.11
    network_mode: host
    restart: "no"
    depends_on: [node-0, node-1, node-2, node-3, node-4, node-5]
    command: >-
      sh -c '
      sleep 8 &&
      redis-cli -a testpass --cluster create
      127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002
      127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005
      --cluster-replicas 1 --cluster-yes'
