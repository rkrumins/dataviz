apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend-backendconfig
  namespace: synodic
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 80
  # Must exceed the backend's slowest ASGI tier (versioning, 120s) and
  # match the pod nginx's proxy_read_timeout (180s): the app's structured
  # JSON 504 has to win the race, never an opaque load-balancer 504.
  timeoutSec: 180
  connectionDraining:
    drainingTimeoutSec: 15
  cdn:
    enabled: true
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: false
