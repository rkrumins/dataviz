# Hand-curated few-shot examples for NL → SearchQuery translation.
#
# Loaded by NLSearchService and injected into the prompt prefix. The
# prefix (schema + examples + system instructions) is shared across every
# request and benefits from Anthropic prompt caching — the user's
# question is the only varying suffix.
#
# Coverage targets the four headline use cases from the brief:
#   1. Orphan / leaf / root detection (graph-shape predicates)
#   2. Property-value queries (single + combined predicates)
#   3. Path queries between two URNs, with optional edge-property filter
#   4. Lineage drill ("within N hops downstream of …")
#
# Plus a few negative examples — questions that are *not* searchable
# (e.g. "create a new node") — so the model learns to politely refuse.
#
# Add or refine examples here whenever the offline evaluator
# (backend/tests/nl/) drops below the 80% structural-match threshold on
# a particular question shape.

examples:
  - question: "Show all PII columns in this view"
    interpreted: >-
      Find every node that has a "PII" tag, scoped to the current view,
      and roll up by domain so we orient before drilling.
    query:
      predicate:
        kind: tag
        values: [PII]
        op: has
      options:
        results: both
        pageSize: 50
        aggregations:
          - by: ancestorType
            ancestorEntityTypes: [domain]
            maxBuckets: 20
        includeAncestorPath: true

  - question: "Which datasets have no upstream lineage?"
    interpreted: >-
      Lineage roots — datasets with zero incoming lineage edges. Useful
      to find sources of truth.
    query:
      predicate:
        kind: group
        op: and
        children:
          - kind: isRoot
            edgeClass: lineage
          - kind: entityType
            op: in
            values: [dataset]
      options:
        results: both
        pageSize: 50
        aggregations:
          - by: entityType

  - question: "Find disconnected schema fields"
    interpreted: >-
      Schema fields with no incoming or outgoing lineage edges — orphan
      candidates for cleanup.
    query:
      predicate:
        kind: group
        op: and
        children:
          - kind: isOrphan
            edgeClass: lineage
          - kind: entityType
            op: in
            values: [schemaField]
      options:
        results: both
        pageSize: 50

  - question: "Show big tables — anything with rowCount over a million"
    interpreted: >-
      Property-based filter on rowCount > 1_000_000, sorted by row count
      so the largest tables surface first.
    query:
      predicate:
        kind: property
        key: rowCount
        op: gt
        value: 1000000
      options:
        results: hits
        pageSize: 50
        sortProperty: rowCount
        sortDir: desc

  - question: "What paths connect dataset:orders to dataset:reporting?"
    interpreted: >-
      Path query: every lineage path from orders to reporting, up to 4
      hops.
    query:
      predicate:
        kind: path
        sourceUrns: ["urn:li:dataset:orders"]
        targetUrns: ["urn:li:dataset:reporting"]
        direction: outgoing
        edgeClass: lineage
        maxHops: 4
      options:
        results: paths

  - question: "Reliable lineage paths from orders to reporting — confidence above 0.9"
    interpreted: >-
      Same as a path query, but only paths whose every edge has
      confidence ≥ 0.9.
    query:
      predicate:
        kind: path
        sourceUrns: ["urn:li:dataset:orders"]
        targetUrns: ["urn:li:dataset:reporting"]
        direction: outgoing
        edgeClass: lineage
        maxHops: 4
        edgePredicate:
          kind: edgeProperty
          key: confidence
          op: gte
          value: 0.9
      options:
        results: paths

  - question: "Anything two lineage hops downstream of orders.id"
    interpreted: >-
      Lineage drill: nodes within 2 hops, walking downstream from a
      specific URN.
    query:
      predicate:
        kind: withinHops
        urns: ["urn:li:dataset:orders.id"]
        hops: 2
        direction: out
        edgeClass: lineage
      options:
        results: both
        pageSize: 50
        aggregations:
          - by: ancestorType
            ancestorEntityTypes: [domain]

  - question: "Nodes with PII tag AND logicalType STRING"
    interpreted: >-
      AND composition: tag check plus property comparison. Map mode
      rolls up by domain.
    query:
      predicate:
        kind: group
        op: and
        children:
          - kind: tag
            values: [PII]
            op: has
          - kind: property
            key: logicalType
            op: eq
            value: STRING
      options:
        results: both
        pageSize: 50
        aggregations:
          - by: ancestorType
            ancestorEntityTypes: [domain]
        includeAncestorPath: true

negative_examples:
  - question: "Create a new dataset called sales_2026"
    response: >-
      I can't create or modify graph data — Search is read-only. If you
      want to add a node, use the canvas's node-palette toolbar.

  - question: "Delete all PII columns"
    response: >-
      I can't delete data. I can show you which nodes are tagged PII so
      you can review them in the canvas.
