# Keepalive connection pools to the API upstreams. Without these (and the
# ``Connection ""`` header + HTTP/1.1 below) nginx opened a FRESH upstream
# TCP connection per proxied request and closed it after — pure churn under
# the canvas's request bursts. A warm pool removes the per-request connect
# handshake to the backend. (This does NOT change the browser<->nginx side;
# that 6-connection HTTP/1.1 limit is addressed by HTTP/2 at the TLS edge in
# prod — see deploy/k8s ingress — and by the WS5/WS6 request-count collapse.)
upstream viz_backend {
    server viz-service:8000;
    keepalive 32;
}

# What scheme the CLIENT used, which is not what this container sees.
#
# nginx listens on plain :80 inside the pod; TLS terminates at the
# ingress. So ``$scheme`` is always "http" here, and forwarding it
# OVERWROTE the ``X-Forwarded-Proto: https`` the ingress had already
# set. The backend therefore believed every request arrived over plain
# HTTP: it never emitted HSTS, and ``/auth/diagnostics`` reported
# ``requestIsSecure: false`` on a correctly-secured deployment — which
# is precisely the field an operator reads when sessions are misbehaving.
#
# Honour the incoming header when there is one, and fall back to
# ``$scheme`` for a direct hit with no proxy in front.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# HSTS only when the client really is on HTTPS. Sending it over plain
# HTTP is ignored by browsers, but sending it from a dev stack on
# localhost pins the whole origin to HTTPS in that browser and is
# genuinely painful to undo.
map $client_scheme $hsts_header {
    default '';
    https   'max-age=31536000; includeSubDomains';
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    # Level 6 matches the app's own ORJSON/gzip middleware — the default
    # level 1 barely compressed the large aggregated/trace JSON payloads.
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ── Liveness probe (nginx is up) — Docker HEALTHCHECK / K8s liveness
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"frontend"}';
        add_header Content-Type application/json;
    }

    # ── Readiness probe — checks that backend is reachable (K8s readiness)
    location = /readyz {
        access_log off;
        proxy_pass         http://viz-service:8000/health;
        proxy_read_timeout 3s;
        proxy_connect_timeout 2s;
    }

    # ── Visualization Service API docs (/openapi.json, /docs, /redoc) ─
    location = /openapi.json {
        proxy_pass         http://viz-service:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $client_scheme;
    }
    location = /viz-docs {
        proxy_pass         http://viz-service:8000/docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $client_scheme;
    }
    location = /viz-redoc {
        proxy_pass         http://viz-service:8000/redoc;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $client_scheme;
    }

    # ── Visualization Service API (/api/*) ────────────────────────────
    location /api/ {
        proxy_pass         http://viz_backend;
        proxy_http_version 1.1;
        # Required for upstream keepalive to actually pool: clear the
        # per-request Connection header so nginx reuses the pooled conn.
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $client_scheme;
        # Bulk import/export uploads were 413ing at the nginx default of
        # 1m; endpoints with stricter app-level caps (e.g. branding logo
        # upload) still enforce their own limits.
        client_max_body_size  100m;
        # Fail fast when the upstream is down instead of the 60s default.
        proxy_connect_timeout 5s;
        # Margin over the backend's slowest ASGI tier (versioning, 120s)
        # so the app's timeout — with its clean JSON 504 — always wins
        # the race, never an opaque nginx 504.
        proxy_read_timeout    180s;
    }

    # ── Frontend SPA — client-side routing fallback ───────────────────
    location / {
        # ── Security headers ──────────────────────────────────────────────
        #
        # Declared per-location rather than once on the server block, for
        # two reasons that pull in the same direction.
        #
        # nginx does not MERGE add_header across levels: a location with any
        # add_header of its own inherits none of the parent's. So a
        # server-level declaration would silently skip every block below
        # that sets even a Content-Type.
        #
        # And nginx APPENDS to what the upstream already sent. The proxied
        # locations must therefore be left alone: the backend sets its own
        # policy on /docs that allows cdn.jsdelivr.net for Swagger UI, and a
        # second CSP header is enforced as the INTERSECTION of the two — so
        # inheriting this stricter one here would break the API docs rather
        # than harden them.
        #
        # These have to exist at all because nginx serves index.html
        # straight off disk. The backend never sees the request for the one
        # thing a browser renders, so its strong ``script-src 'self'``
        # applied only to JSON responses — where a CSP does close to nothing
        # — while the document itself shipped with no CSP, no
        # X-Frame-Options and no HSTS. The app was frameable.
        #
        # ``always`` matters: without it nginx omits add_header on error
        # responses, and the SPA fallback serves index.html through a 404 on
        # every deep link.
        #
        # Kept close to backend/app/middleware/security_headers.py so the two
        # can be diffed. The differences are the document's own: Google Fonts
        # (index.html links them) and object-src/base-uri/form-action, which
        # only mean anything for a document.
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        # 'unsafe-inline' on style-src only: component libraries set inline
        # style attributes, and removing that is a far larger change than
        # this one. script-src carries no such escape hatch — the two
        # pre-hydration blocks that used to force it now live in /boot.js.
        # One line on purpose: nginx has no line-continuation inside a quoted
        # value, so a wrapped policy silently becomes a DIFFERENT policy
        # rather than a syntax error.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

            try_files $uri $uri/ /index.html;
    }

    # ── Pre-hydration bootstrap ───────────────────────────────────────
    # Deliberately NOT under the immutable rule below. Everything in
    # public/ is served verbatim — Vite does not content-hash it — so a
    # 30-day immutable cache would pin a stale copy of a script that runs
    # before React and can therefore break the first paint in ways that
    # look like anything but a caching problem.
    location = /boot.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Cache static assets ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # Re-stated because this block has an add_header of its own and
        # therefore inherits none. ``nosniff`` is the one that matters
        # for a bundle: without it a browser may execute a mistyped
        # response as script.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }
}
