apiVersion: apps/v1
kind: Deployment
metadata:
  name: versioning-worker
  namespace: synodic
  labels:
    app.kubernetes.io/name: versioning-worker
    app.kubernetes.io/component: worker
spec:
  # Projection is serialized per graph_id by a cross-pod Postgres advisory
  # lock + a Redis consumer group, so replicas never double-project. Start at
  # 1; scale for throughput on many concurrently-lagging graphs.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: versioning-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versioning-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 60
      initContainers:
        # WS1.1 decoupling: gate ONLY on Postgres + Redis. Do NOT wait for
        # FalkorDB — the worker connects to it lazily and fast-fails while it
        # loads, so a graph blip must not block this pod from starting.
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z postgres 5432; do sleep 2; done
              echo "Waiting for redis..."
              until nc -z redis 6379; do sleep 2; done
              echo "Dependencies ready."
      containers:
        - name: versioning-worker
          image: REGISTRY/aggregation-worker:latest
          # The worker image bundles the whole backend; run the versioning
          # projection module instead of the aggregation one (Dockerfile CMD).
          command: ["python", "-m", "backend.app.services.versioning"]
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: worker-config
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
            # Required to decrypt pinned encrypted provider credentials when
            # projecting into a non-default FalkorDB instance (R-M3).
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CREDENTIAL_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # No HTTP health server on this worker yet, so no httpGet probes
          # (they would flap and restart-loop). A crash exits the process and
          # the Deployment restarts it; a dedicated liveness endpoint is a
          # follow-up. Projection is idempotent + PEL-recovered on restart.
