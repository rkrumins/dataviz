# Sidecar injection + wait-for-deps fix for the three backends that
# need Cloud SQL / Memorystore. Each Deployment gets a db-proxy and
# redis-proxy native sidecar (initContainer with restartPolicy:
# Always — GA in K8s 1.29) listening on 127.0.0.1 inside the pod and
# TCP-forwarding to the proxy VM's NIC0 address (held in proxy-config).
#
# Kustomize strategic merge by `name`: wait-for-deps's `command` is
# replaced, db-proxy / redis-proxy are appended to initContainers.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-controlplane
  namespace: synodic
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for falkordb..."
              until nc -z falkordb 6379; do sleep 2; done
              echo "All dependencies ready."
        - name: db-proxy
          image: alpine/socat:1.8.0.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["sh", "-c"]
          args:
            - 'exec socat TCP-LISTEN:5432,fork,reuseaddr,bind=127.0.0.1 "TCP:${PROXY_HOST}:5432"'
          env:
            - name: PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: VM_HOST
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        - name: redis-proxy
          image: alpine/socat:1.8.0.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["sh", "-c"]
          args:
            - 'exec socat TCP-LISTEN:6379,fork,reuseaddr,bind=127.0.0.1 "TCP:${PROXY_HOST}:6379"'
          env:
            - name: PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: VM_HOST
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-worker
  namespace: synodic
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for falkordb..."
              until nc -z falkordb 6379; do sleep 2; done
              echo "Waiting for aggregation-controlplane..."
              until nc -z aggregation-controlplane 8091; do sleep 3; done
              echo "All dependencies ready."
        - name: db-proxy
          image: alpine/socat:1.8.0.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["sh", "-c"]
          args:
            - 'exec socat TCP-LISTEN:5432,fork,reuseaddr,bind=127.0.0.1 "TCP:${PROXY_HOST}:5432"'
          env:
            - name: PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: VM_HOST
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        - name: redis-proxy
          image: alpine/socat:1.8.0.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["sh", "-c"]
          args:
            - 'exec socat TCP-LISTEN:6379,fork,reuseaddr,bind=127.0.0.1 "TCP:${PROXY_HOST}:6379"'
          env:
            - name: PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: VM_HOST
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
