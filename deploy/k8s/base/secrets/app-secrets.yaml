apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: synodic
type: Opaque
stringData:
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  # Retired signing keys (comma-separated, most-recent first), accepted for
  # VERIFICATION only. Envsubst leaves this EMPTY when unset -> single-key
  # behaviour, unchanged. Populate it during a rotation: without it, changing
  # JWT_SECRET_KEY invalidates every live session the moment the Secret is
  # applied, and because updating a Secret does NOT restart pods, the old and
  # new key coexist across replicas until each is replaced — so auth flaps
  # request-to-request instead of failing cleanly.
  JWT_SECRET_KEY_PREVIOUS: "${JWT_SECRET_KEY_PREVIOUS}"
  CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY}"
  ADMIN_EMAIL: "${ADMIN_EMAIL}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  # WS2.3: shared secret for control-plane internal auth. Envsubst leaves it
  # EMPTY when unset at deploy time -> the control plane runs with auth
  # disabled (still functional). Set it to enforce service-to-service auth.
  AGGREGATION_INTERNAL_TOKEN: "${AGGREGATION_INTERNAL_TOKEN}"
  # Streams and cache Redis AUTH passwords. Envsubst leaves these EMPTY when
  # unset at deploy time -> the resolver treats an empty password as no-auth
  # (dev/staging Redis runs unauthenticated). Set for a managed/authenticated
  # instance (see overlays/production/patches/managed-data-tier.yaml).
  REDIS_STREAMS_PASSWORD: "${REDIS_STREAMS_PASSWORD}"
  REDIS_CACHE_PASSWORD: "${REDIS_CACHE_PASSWORD}"
  # FalkorDB graph AUTH password (env-default instance). Empty = no auth.
  # Set it TOGETHER with --requirepass in the FalkorDB REDIS_ARGS: the backend
  # pods read it via envFrom (FALKORDB_PASSWORD), and the store pods' probes
  # read it as REDISCLI_AUTH — enabling server auth without this key leaves
  # every client and probe replying NOAUTH. Per-provider graphs keep their
  # credentials on the provider row instead (encrypted blob).
  FALKORDB_PASSWORD: "${FALKORDB_PASSWORD}"
