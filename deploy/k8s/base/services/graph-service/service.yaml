apiVersion: v1
kind: Service
metadata:
  name: graph-service
  namespace: synodic
  labels:
    app.kubernetes.io/name: graph-service
  annotations:
    cloud.google.com/backend-config: '{"default": "graph-service-backendconfig"}'
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app.kubernetes.io/name: graph-service
