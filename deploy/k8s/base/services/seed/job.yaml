apiVersion: batch/v1
kind: Job
metadata:
  name: synodic-seed
  namespace: synodic
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/component: seeder
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
    spec:
      serviceAccountName: synodic-backend
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-falkordb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z falkordb 6379; do sleep 2; done
      containers:
        - name: seed
          image: REGISTRY/synodic-seed:latest
          env:
            - name: FALKORDB_HOST
              value: "falkordb"
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_GRAPH_NAME
              value: "nexus_lineage"
            - name: SEED_SCENARIOS
              value: "finance,ecommerce"
            - name: SEED_SCALE
              value: "1"
            - name: SEED_BREADTH
              value: "1"
            - name: SEED_DEPTH
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
