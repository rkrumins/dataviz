apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend-backendconfig
  namespace: synodic
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 80
  # The load balancer's limit on a whole response, so it must let a
  # streamed export finish: an hour, as the pod nginx allows the export
  # routes (proxy_read_timeout 3600s). Every other request is still cut
  # far sooner by the app's own tiers (120s at most) and nginx (180s),
  # so the app's structured JSON 504 still wins those races.
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 15
  cdn:
    enabled: true
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: false
