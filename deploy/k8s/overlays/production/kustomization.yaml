apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # DR: 6-hourly RDB snapshot → multi-region GCS (launch-scale §8).
  # Needs FALKORDB_BACKUP_BUCKET in .env.deploy + Workload Identity on the
  # synodic-backup SA; see the header of the file and docs/FALKORDB_DR_RUNBOOK.md.
  - resources/falkordb-dr-backup.yaml

patches:
  - path: patches/replicas.yaml
  - path: patches/resource-limits.yaml
  - path: patches/ingress-patch.yaml
  - path: patches/anti-affinity.yaml
  - path: patches/hpa-production.yaml
  # Managed data tier: Cloud SQL + Memorystore replace in-cluster postgres/redis,
  # and set DB_POOLER_MODE=transaction. Operator supplies endpoints via .env.deploy.
  - path: patches/managed-data-tier.yaml
  # Override LOG_LEVEL to WARNING
  - target:
      kind: ConfigMap
      name: common-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "WARNING"

images:
  - name: REGISTRY/viz-service
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/viz-service
    newTag: prod-latest
  - name: REGISTRY/aggregation-controlplane
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/aggregation-controlplane
    newTag: prod-latest
  - name: REGISTRY/aggregation-worker
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/aggregation-worker
    newTag: prod-latest
  - name: REGISTRY/stats-service
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/stats-service
    newTag: prod-latest
  - name: REGISTRY/frontend
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/frontend
    newTag: prod-latest
  - name: REGISTRY/falkordb
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/falkordb
    newTag: prod-latest
  - name: REGISTRY/seed
    newName: us-docker.pkg.dev/PROJECT_ID/synodic/seed
    newTag: prod-latest
