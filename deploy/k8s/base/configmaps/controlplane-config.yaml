apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-config
  namespace: synodic
data:
  SYNODIC_ROLE: "controlplane"
  AGGREGATION_DISPATCH_MODE: "redis"
  AGGREGATION_API_PORT: "8091"
  FALKORDB_SOCKET_TIMEOUT: "5"
  # Outbox relay (the activity ledger), analytics warmer and the product-event
  # / refresh-token retention sweeps run here — the control plane's lifespan
  # starts them, single-flight across replicas. The warm interval is also
  # the epoch grid the WEB tier snaps every analytics window to, so this value
  # and viz-config's copy must stay identical: a warmer phase-locked to a grid
  # its readers do not share writes documents nobody looks up, and the only
  # symptom is a dashboard that quietly stops being fast.
  ANALYTICS_WARM_INTERVAL_SECONDS: "300"
  PRODUCT_EVENT_RETENTION_DAYS: "400"
  # The activity log's horizon (ledger and relayed outbox). The sweep runs
  # here; viz-config carries the same value so readers are told the truth
  # about how far back the log goes.
  ACTIVITY_RETENTION_DAYS: "730"
  # How long a finished aggregation run is kept. The prune runs here;
  # viz-config carries the same value so Analytics says how far back runs reach.
  AGGREGATION_JOB_RETENTION_DAYS: "90"
