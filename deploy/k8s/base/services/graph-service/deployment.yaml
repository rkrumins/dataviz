apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-service
  namespace: synodic
  labels:
    app.kubernetes.io/name: graph-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: graph-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graph-service
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for falkordb..."
              until nc -z falkordb 6379; do sleep 2; done
              echo "All dependencies ready."
      containers:
        - name: graph-service
          image: REGISTRY/synodic-graph:latest
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: graph-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
