apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: synodic
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: synodic-frontend
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for viz-service..."
              until nc -z viz-service 8000; do sleep 2; done
              echo "All dependencies ready."
      containers:
        - name: frontend
          image: REGISTRY/frontend:latest
          # R-M2: drain before SIGTERM so nginx deregisters from the LB before
          # it stops accepting — avoids 502s on rollout / scale-down.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
