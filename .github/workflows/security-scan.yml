name: security-scan

# Blocking dependency + image-config scan. Dependabot alerts are advisory;
# this workflow FAILS the build on fixable HIGH/CRITICAL findings so they can't
# merge. Runs on PRs, on push to the default branch, and weekly.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, landing]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # ci (not install) so it audits the locked tree; ignore-scripts for safety.
      - name: npm ci
        working-directory: ${{ matrix.app }}
        run: npm ci --ignore-scripts
      - name: npm audit
        working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      # Floors are already CVE-curated, so any finding means action is due.
      - name: Audit backend requirements
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-test.txt

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Informational: surfaces IaC misconfigs and any reintroduced :latest tag
      # across deploy/ + compose. Kept non-blocking (exit-code 0) so it doesn't
      # gate PRs on the pre-existing k8s-hardening backlog; tighten to exit-code
      # 1 once a .trivyignore baseline is in place.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
