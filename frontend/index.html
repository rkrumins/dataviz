<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nexus-icon.svg" />
    <link rel="apple-touch-icon" href="/nexus-icon.svg" />
    <link rel="manifest" href="/api/v1/branding/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />
    <title>Context Visualization Platform</title>

    <!-- Pre-hydration paint (branding + theme), before React boots.
         An external classic script rather than inline: an inline one
         would force 'unsafe-inline' onto the document's script-src,
         which is the directive whose whole value is not having it.
         Must stay non-deferred — both blocks have to run before first
         paint. See public/boot.js. -->
    <script src="/boot.js"></script>

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
