apiVersion: apps/v1
kind: Deployment
metadata:
  name: versioning-worker
  namespace: synodic
  labels:
    app.kubernetes.io/name: versioning-worker
    app.kubernetes.io/component: worker
spec:
  # Projection is serialized per graph_id by a cross-pod Postgres advisory
  # lock + a Redis consumer group, so replicas never double-project. Start at
  # 1; scale for throughput on many concurrently-lagging graphs.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: versioning-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versioning-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 60
      # No init gates: postgres/redis are managed endpoints in production (the
      # in-cluster Services are deleted by the managed-data-tier patch, so an
      # nc -z against those names deadlocks every rescheduled pod in Init), and
      # FalkorDB is connected lazily with fast-fail (WS1.1). The worker's own
      # loops retry both stores with backoff.
      containers:
        - name: versioning-worker
          image: REGISTRY/aggregation-worker:latest
          # The worker image bundles the whole backend; run the versioning
          # projection module instead of the aggregation one (Dockerfile CMD).
          command: ["python", "-m", "backend.app.services.versioning"]
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: worker-config
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
            # Required to decrypt pinned encrypted provider credentials when
            # projecting into a non-default FalkorDB instance (R-M3).
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CREDENTIAL_ENCRYPTION_KEY
            - name: REDIS_STREAMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_STREAMS_PASSWORD
                  optional: true
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_CACHE_PASSWORD
                  optional: true
          volumeMounts:
            - name: redis-streams-certs
              mountPath: /certs/streams
              readOnly: true
            - name: redis-cache-certs
              mountPath: /certs/cache
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # No HTTP health server on this worker yet, so no httpGet probes
          # (they would flap and restart-loop). A crash exits the process and
          # the Deployment restarts it; a dedicated liveness endpoint is a
          # follow-up. Projection is idempotent + PEL-recovered on restart.
      volumes:
        - name: redis-streams-certs
          secret:
            secretName: redis-streams-certs
            optional: true
        - name: redis-cache-certs
          secret:
            secretName: redis-cache-certs
            optional: true
