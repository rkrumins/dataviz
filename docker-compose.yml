# ══════════════════════════════════════════════════════════════════════
# Synodic — Full-Stack Docker Compose (Three-Service Architecture)
# ══════════════════════════════════════════════════════════════════════
#
# Architecture:
#   viz-service (8000)  ──proxy──>  aggregation-controlplane (8091)
#                                          │
#                                     Redis Streams
#                                          │
#                                   aggregation-worker (×N)
#
# Quick start (full platform):
#   docker compose up --build
#
# Just infrastructure (for local dev with uvicorn):
#   docker compose up falkordb postgres redis
#
# Scale aggregation workers:
#   docker compose up --scale aggregation-worker=3
#
# With demo data seeding:
#   docker compose --profile seed up --build
#
# Tear down (keep data):
#   docker compose down
#
# Tear down + delete all data:
#   docker compose down -v
# ══════════════════════════════════════════════════════════════════════

name: synodic

services:

  # ── FalkorDB (Graph Database) — vanilla image, no baked data ──────
  falkordb:
    # Vanilla upstream image (no baked data). Demo data via the `seed` service
    # (`docker compose --profile seed up`); real data via import.
    image: falkordb/falkordb:v4.18.11
    restart: unless-stopped
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDB_UI_PORT:-3000}:3000"       # FalkorDB Browser UI
    environment:
      # CACHE_SIZE is the per-graph COMPILED-QUERY-PLAN cache. The label-
      # bucket read path issues many distinct parameterized Cypher shapes
      # (one per node label × direction), so 50 thrashed and re-planned hot
      # queries; 256 keeps the canvas/trace/aggregated shapes resident.
      # THREAD_COUNT should track vCPUs in prod (managed FalkorDB): it is
      # the parallel Cypher execution width and the ceiling the app's
      # slot-shed (PROVIDER_MAX_CONCURRENCY, 429 on saturation) sits above.
      FALKORDB_ARGS: THREAD_COUNT 4 OMP_THREAD_COUNT 1 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 180000 MAX_QUEUED_QUERIES 64 QUERY_MEM_CAPACITY 536870912 CACHE_SIZE 256
      # Instance-level memory ceiling: QUERY_MEM_CAPACITY bounds ONE query;
      # without maxmemory the dataset itself can still OOM-kill the container.
      # noeviction = writes fail loudly at the ceiling instead of silent eviction.
      # AOF everysec: with snapshot-only persistence a restart reloads the
      # last RDB and silently DROPS every write since it (observed live
      # 2026-07-11: a stack restart minutes after an import resurrected the
      # graph with containment but without its lineage edges — every
      # aggregation run then correctly produced zero cells). AOF bounds the
      # loss window to ~1s; aof-load-truncated tolerates a torn tail after
      # a crash instead of refusing to start.
      #
      # FAST RECOVERY (2026-07-11): a restart replays the AOF *incremental*
      # command-by-command (slow — ~minutes/GB), while the AOF *base* (an RDB)
      # bulk-loads fast (~74MB/s). So recovery time is bounded by the incr
      # SIZE. The Redis defaults (rewrite at +100% of a large base, i.e. only
      # once the incr exceeds ~2GB) let a single big import leave a multi-GB
      # incr that takes ~an hour to replay. Refresh the base sooner (rewrite
      # at +80% but never below 256MB) so the incr — and thus restart time —
      # stays small. The acute case (a bulk import) is compacted explicitly by
      # the importer via BGREWRITEAOF right after the push.
      REDIS_ARGS: --maxmemory ${FALKORDB_MAXMEMORY:-14gb} --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --aof-load-truncated yes --auto-aof-rewrite-percentage 80 --auto-aof-rewrite-min-size 256mb
    volumes:
      # FalkorDB's actual data dir is /var/lib/falkordb/data (the image
      # symlinks /data/data → there). Mounting the volume at /data would
      # capture nothing, so runtime graph writes would be lost on every
      # `compose down`.
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      # LOADING counts as healthy-enough: the process is alive and replaying
      # its AOF/RDB; dependent services boot and the app surfaces a retryable
      # "warming" state instead of the whole stack gating on a multi-minute
      # replay (and anything auto-healing on `unhealthy` must not kill the
      # replay — that restarts it from scratch, forever).
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|LOADING'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s

  # ── Redis (Message Broker) ─────────────────────────────────────────
  # Dedicated Redis 7 for aggregation job dispatch (Redis Streams) and
  # event pub/sub.  Separate from FalkorDB — graph memory must not
  # compete with broker data.  AOF persistence ensures stream durability
  # across restarts.  noeviction policy prevents silent message loss.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── PostgreSQL (Management Database) ──────────────────────────────
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    # max_connections must cover the sum of every service's SQLAlchemy
    # pool ceilings (db/engine.py _POOL_DEFAULTS: ~85 potential connections
    # PER PROCESS incl. GRAPH_READ × GUNICORN_WORKERS=4 on viz alone, plus
    # controlplane / aggregation-worker / stats-service / versioning-worker).
    # The postgres default of 100 is exhausted under load spikes and
    # fails as "FATAL: sorry, too many clients already". Pools fill
    # lazily, so 400 is headroom, not steady-state usage. At GKE scale front
    # Postgres with PgBouncer — one server can't cover an HPA'd fleet.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-400}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── synodic-upgrade (one-shot Alembic) ────────────────────────────
  # Standalone image that owns every schema operation. Runs once per
  # `docker compose up`, exits with code 0 on success. Every backend
  # service depends on this completing (service_completed_successfully)
  # so they never boot against a stale schema.
  #
  # For Alembic operations other than upgrade-to-head, run ad-hoc:
  #   docker compose run --rm upgrade current
  #   docker compose run --rm upgrade heads
  #   docker compose run --rm upgrade downgrade --revision <rev>
  upgrade:
    build:
      context: .
      dockerfile: backend/Dockerfile.upgrade
    image: synodic-upgrade:local
    command: ["upgrade"]
    environment:
      MANAGEMENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Aggregation Control Plane (Port 8091) ─────────────────────────
  # Owns the aggregation API surface: job lifecycle, scheduling, crash
  # recovery, drift detection.  Dispatches execution to Workers via
  # Redis Streams.  Does NOT run heavy FalkorDB MERGE — that's the
  # Workers.  Uses SHORT FalkorDB timeouts (5s) so the API stays
  # responsive even when the graph provider is slow/down.
  #
  # Waits for `upgrade` to finish so the schema is at head before the
  # control plane initialises its own aggregation tables.
  aggregation-controlplane:
    build:
      context: .
      dockerfile: backend/Dockerfile.controlplane
    ports:
      - "${CONTROLPLANE_PORT:-8091}:8091"
    environment:
      MANAGEMENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Cache Redis MUST be the dedicated ``redis`` service, not the
      # ``falkordb`` container. DB 1 keeps the keyspace clean of the
      # aggregation job streams on DB 0.
      CACHE_REDIS_URL: redis://redis:6379/1
      AGGREGATION_DISPATCH_MODE: redis

      # FalkorDB access for drift checks, readiness probes, and purge.
      # Short timeout — API responsiveness over completeness.
      FALKORDB_HOST: falkordb
      # Docker reality: a provider stored with host localhost/127.0.0.1 points
      # at THIS container, not FalkorDB. Redirect any loopback host to the
      # reachable Docker service so every such provider works without
      # per-provider edits. Override (or set empty) to disable.
      FALKORDB_DOCKER_LOCALHOST_REWRITE: "${FALKORDB_DOCKER_LOCALHOST_REWRITE:-falkordb}"
      FALKORDB_PORT: "6379"
      FALKORDB_SOCKET_TIMEOUT: "5"
      # Must match TIMEOUT_MAX in the falkordb service's FALKORDB_ARGS —
      # the backend clamps per-query timeouts to it (server rejects more).
      FALKORDB_SERVER_TIMEOUT_MAX_MS: "${FALKORDB_SERVER_TIMEOUT_MAX_MS:-180000}"
      FALKORDB_GRAPH_NAME: ${FALKORDB_GRAPH_NAME:-nexus_lineage}


      AGGREGATION_API_PORT: "8091"
      # Probe claim TTL. Set HERE because the claim is taken where a probe is
      # enqueued — the probe scheduler and the reconcile sweep, both of which
      # live in this process. It only has to outlive one in-flight probe, not
      # a large-graph scan: reusing the stats TTL (1200s) would leave a source
      # un-probeable for twenty minutes after a worker died mid-probe.
      STATS_PROBE_DEDUP_TTL_SECS: "${STATS_PROBE_DEDUP_TTL_SECS:-90}"
      SYNODIC_ROLE: controlplane
      # Internal service auth (WS2.3). Shared secret the control plane
      # requires on every route except health/docs. UNSET by default ->
      # auth DISABLED (dev works with no token, logs a warning); set it to
      # enforce. In k8s it is supplied by the app-secrets Secret. The same
      # value must be set on every client (viz-service, stats-service).
      AGGREGATION_INTERNAL_TOKEN: ${AGGREGATION_INTERNAL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        # WS1.1 decoupling: wait only for the container to START, not for its
        # healthcheck (which requires the full dataset to finish LOADING). A
        # loading/unhealthy FalkorDB must not block the rest of the stack from
        # starting — services connect lazily and fast-fail while it warms.
        condition: service_started
      # Schema must be at head before any backend service initialises.
      upgrade:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Visualization Service (Port 8000) ─────────────────────────────
  # Primary backend: auth, workspaces, graph queries, ontology, views.
  # Aggregation endpoints are proxied to the Control Plane (port 8091).
  # On first boot it runs Alembic migrations, seeds templates, and
  # bootstraps an admin user + default provider/workspace from env.
  viz-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.viz
    ports:
      - "${VIZ_PORT:-8000}:8000"
    environment:
      # The frontend container's nginx proxies /api here, so the peer is
      # never loopback and gunicorn would otherwise discard the
      # X-Forwarded-For nginx sets — putting every user in one
      # rate-limit bucket keyed on the proxy. Only the compose network
      # can reach this port.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
      # Shared rate-limit storage. Without it each of the 4 gunicorn
      # workers keeps its own in-memory counters.
      RATELIMIT_STORAGE_URI: "${RATELIMIT_STORAGE_URI:-redis://redis:6379/1}"
      # Graph provider bootstrap (used if management DB is empty)
      GRAPH_PROVIDER: ${GRAPH_PROVIDER:-falkordb}
      FALKORDB_HOST: falkordb
      # Docker reality: a provider stored with host localhost/127.0.0.1 points
      # at THIS container, not FalkorDB. Redirect any loopback host to the
      # reachable Docker service so every such provider works without
      # per-provider edits. Override (or set empty) to disable.
      FALKORDB_DOCKER_LOCALHOST_REWRITE: "${FALKORDB_DOCKER_LOCALHOST_REWRITE:-falkordb}"
      FALKORDB_PORT: "6379"
      # Must match TIMEOUT_MAX in the falkordb service's FALKORDB_ARGS.
      FALKORDB_SERVER_TIMEOUT_MAX_MS: "${FALKORDB_SERVER_TIMEOUT_MAX_MS:-180000}"
      FALKORDB_GRAPH_NAME: ${FALKORDB_GRAPH_NAME:-nexus_lineage}

      # Management database
      MANAGEMENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Auth — fail fast if secrets aren't set
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_MINUTES: "${JWT_EXPIRY_MINUTES:-60}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@synodic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}

      # Credential encryption (omit for plaintext in dev)
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}

      # Redis (for aggregation event listener — syncs status from CP)
      REDIS_URL: redis://redis:6379/0
      # Dedicated cache Redis (FalkorDB provider's ancestor + URN caches).
      # Separate DB index keeps it isolated from job streams on DB 0.
      CACHE_REDIS_URL: redis://redis:6379/1

      # Aggregation proxy: all 13 aggregation endpoints are forwarded
      # to the Control Plane.  The viz-service does NOT run any
      # aggregation logic locally — no dispatcher, no scheduler, no
      # worker.  Set to 'false' for single-process dev mode.
      AGGREGATION_PROXY_ENABLED: "true"
      AGGREGATION_SERVICE_URL: http://aggregation-controlplane:8091
      # Internal service auth (WS2.3): token the proxy attaches to reach the
      # control plane. UNSET -> no header sent (and the CP has auth disabled
      # too), so dev works. Must match the control plane's value.
      AGGREGATION_INTERNAL_TOKEN: ${AGGREGATION_INTERNAL_TOKEN:-}
      SYNODIC_ROLE: web

      # CORS — allow the frontend container + local dev
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3080,http://localhost:5173,http://localhost:3000}

      # WS1.1: versioned-graph projection runs in the DEDICATED
      # versioning-worker container, NOT in-process. Its full-seed build is
      # CPU-bound and, on the web event loop, wedged the loop
      # (event_loop_lag CRITICAL) and froze EVERY request (auth, /docs,
      # health) while FalkorDB loaded/projected. Keep 0 here — the
      # versioning-worker service owns projection. Only set 1 for a
      # single-process dev run with no worker container.
      GRAPHVER_PROJECTION_INPROCESS: "${GRAPHVER_PROJECTION_INPROCESS:-0}"

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Schema must be at head before viz-service initialises.
      upgrade:
        condition: service_completed_successfully
      # Wait for Control Plane to be healthy so the aggregation schema
      # exists and proxy requests don't fail on first boot.
      aggregation-controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Aggregation Worker (Data Plane) ────────────────────────────────
  # Headless batch executor.  Consumes jobs from Redis Streams, runs
  # heavy FalkorDB MERGE operations.  Own connection pools, own circuit
  # breakers.  Provider failures here CANNOT affect the web tier or
  # Control Plane.  No HTTP API — health probe only on port 8090.
  # Scale horizontally: docker compose up --scale aggregation-worker=3
  aggregation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.aggregation
    environment:
      MANAGEMENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Dedicated cache Redis (FalkorDB provider's ancestor + URN caches).
      CACHE_REDIS_URL: redis://redis:6379/1

      # FalkorDB — worker-specific tuning: longer timeouts for heavy
      # MERGE ops, pool sizes auto-scaled from WORKER_CONCURRENCY.
      FALKORDB_HOST: falkordb
      # Docker reality: a provider stored with host localhost/127.0.0.1 points
      # at THIS container, not FalkorDB. Redirect any loopback host to the
      # reachable Docker service so every such provider works without
      # per-provider edits. Override (or set empty) to disable.
      FALKORDB_DOCKER_LOCALHOST_REWRITE: "${FALKORDB_DOCKER_LOCALHOST_REWRITE:-falkordb}"
      FALKORDB_PORT: "6379"
      FALKORDB_SOCKET_TIMEOUT: "60"
      # Must match TIMEOUT_MAX in the falkordb service's FALKORDB_ARGS.
      FALKORDB_SERVER_TIMEOUT_MAX_MS: "${FALKORDB_SERVER_TIMEOUT_MAX_MS:-180000}"

      # Concurrency: max parallel aggregation jobs per worker replica.
      # Pool sizes are auto-computed: graph = concurrency*4+8, redis = concurrency*3+8
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      AGGREGATION_JOB_TIMEOUT_SECS: "${AGGREGATION_JOB_TIMEOUT_SECS:-7200}"

      # Per-graph concurrency limit (prevent FalkorDB write lock contention)
      MAX_CONCURRENT_PER_GRAPH: "${MAX_CONCURRENT_PER_GRAPH:-2}"

      SYNODIC_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      # Schema must be at head before any backend service initialises.
      upgrade:
        condition: service_completed_successfully
      # Worker must start after Control Plane (schema must exist)
      aggregation-controlplane:
        condition: service_healthy
      falkordb:
        # WS1.1 decoupling: wait only for the container to START, not for its
        # healthcheck (which requires the full dataset to finish LOADING). A
        # loading/unhealthy FalkorDB must not block the rest of the stack from
        # starting — services connect lazily and fast-fail while it warms.
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Versioning Projection Worker (Data Plane) ─────────────────────
  # WS1.1: headless worker that projects each versioned graph's committed
  # state into FalkorDB (reconciling poll loop + Redis-stream consumer).
  # Extracted from the web tier — run in-process, its CPU-bound full-seed
  # build wedged the shared event loop (event_loop_lag CRITICAL) and froze
  # every request while FalkorDB loaded. Own pools + circuit breakers; a
  # provider outage here cannot affect the web tier. Does NOT gate on
  # FalkorDB — connects lazily and retries, so it starts even when the graph
  # is down/loading. Scale: docker compose up --scale versioning-worker=2
  versioning-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.aggregation
    command: ["python", "-m", "backend.app.services.versioning"]
    environment:
      MANAGEMENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      FALKORDB_HOST: falkordb
      FALKORDB_DOCKER_LOCALHOST_REWRITE: "${FALKORDB_DOCKER_LOCALHOST_REWRITE:-falkordb}"
      FALKORDB_PORT: "6379"
      FALKORDB_SOCKET_TIMEOUT: "60"
      # Must match TIMEOUT_MAX in the falkordb service's FALKORDB_ARGS.
      FALKORDB_SERVER_TIMEOUT_MAX_MS: "${FALKORDB_SERVER_TIMEOUT_MAX_MS:-180000}"
      SYNODIC_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Headless projector: no HTTP health server yet, so disable the inherited
    # Dockerfile healthcheck (which probes the aggregation worker's port 8090)
    # rather than flap to "unhealthy". restart: unless-stopped covers crashes;
    # a dedicated liveness endpoint is a follow-up.
    healthcheck:
      disable: true
    depends_on:
      upgrade:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Stats Service (Background Poller) ─────────────────────────────
  # Headless refresh loop that keeps per-data-source graph stats
  # (node/edge counts, schema, ontology) fresh in Postgres so the viz
  # service serves cached stats instead of hammering providers on every
  # read. Same isolation model as aggregation-worker: own Postgres
  # session pool (JOBS), own provider registry, own circuit breakers —
  # provider slowness here CANNOT affect the web tier.
  #
  # Architecture: scheduler + XREADGROUP worker + health endpoint,
  # all in one process. Scale horizontally with:
  #   docker compose up -d --scale stats-service=N
  # Per-source Redis SET NX dedup guarantees at-most-one pending poll
  # per data source across replicas.
  stats-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.insights
    environment:
      # Post-purge auto re-aggregation triggers through the Control
      # Plane; without this the purge worker falls back to
      # localhost:8091 (unreachable in-container) and the trigger
      # silently no-ops.
      AGGREGATION_SERVICE_URL: http://aggregation-controlplane:8091
      # Internal service auth (WS2.3): token the post-purge trigger attaches
      # to reach the control plane. UNSET -> no header (CP auth disabled too).
      AGGREGATION_INTERNAL_TOKEN: ${AGGREGATION_INTERNAL_TOKEN:-}
      # Management DB (polling configs + stats cache + data source catalog)
      MANAGEMENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Redis — job stream + dedup keys. Same broker as aggregation.
      REDIS_URL: redis://redis:6379/0
      # Dedicated cache Redis (FalkorDB provider's ancestor + URN caches).
      CACHE_REDIS_URL: redis://redis:6379/1

      # Provider bootstrap — only used when a data source's credentials
      # reference env vars (normal path: credentials come from Postgres).
      FALKORDB_HOST: falkordb
      # Docker reality: a provider stored with host localhost/127.0.0.1 points
      # at THIS container, not FalkorDB. Redirect any loopback host to the
      # reachable Docker service so every such provider works without
      # per-provider edits. Override (or set empty) to disable.
      FALKORDB_DOCKER_LOCALHOST_REWRITE: "${FALKORDB_DOCKER_LOCALHOST_REWRITE:-falkordb}"
      FALKORDB_PORT: "6379"
      # Must match TIMEOUT_MAX in the falkordb service's FALKORDB_ARGS.
      # Critical here: the top-level materialization's 600s budget is
      # clamped to this — a mismatch makes FalkorDB reject the query and
      # large graphs never get their materialized payload.
      FALKORDB_SERVER_TIMEOUT_MAX_MS: "${FALKORDB_SERVER_TIMEOUT_MAX_MS:-180000}"

      # Must match viz-service or stored provider credentials won't decrypt.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}

      # ── Stats tunables (see .env.example for full docs) ─────────
      STATS_SCHEDULER_TICK_SECS: "${STATS_SCHEDULER_TICK_SECS:-30}"
      # Per-lane worker budgets: fast (counts polls + discovery), heavy
      # (deep schema scans), purge. One slow large-graph scan can never
      # occupy the slots that keep counts fresh.
      STATS_WORKER_CONCURRENCY: "${STATS_WORKER_CONCURRENCY:-4}"
      STATS_SWEEP_CONCURRENCY: "${STATS_SWEEP_CONCURRENCY:-2}"
      STATS_HEAVY_CONCURRENCY: "${STATS_HEAVY_CONCURRENCY:-1}"
      STATS_PURGE_CONCURRENCY: "${STATS_PURGE_CONCURRENCY:-1}"
      # Drift probes read FalkorDB's counters instead of scanning, so this
      # budget bounds fan-out against one endpoint, not our own CPU. Its own
      # lane so a minutes-long counts scan can never delay the freshness
      # signal the reconcile sweep keys on.
      STATS_PROBE_CONCURRENCY: "${STATS_PROBE_CONCURRENCY:-4}"
      STATS_PROBE_TIMEOUT_SECS: "${STATS_PROBE_TIMEOUT_SECS:-20}"
      # Background sweep refreshes only REGISTERED assets by default;
      # unregistered ones refresh on demand (hot lane) when viewed.
      DISCOVERY_SWEEP_REGISTERED_ONLY: "${DISCOVERY_SWEEP_REGISTERED_ONLY:-true}"
      STATS_MAX_CONCURRENT_PER_GRAPH: "${STATS_MAX_CONCURRENT_PER_GRAPH:-1}"
      # 900s idle interval: counts freshness is event-driven (app write
      # paths enqueue a counts poll within seconds) and the read path
      # enqueues on stale for actively-viewed sources — the interval is
      # the reconcile safety net, not the freshness mechanism.
      STATS_DEFAULT_INTERVAL_SECS: "${STATS_DEFAULT_INTERVAL_SECS:-900}"
      STATS_MIN_INTERVAL_SECS: "${STATS_MIN_INTERVAL_SECS:-60}"
      STATS_MAX_DELIVERY_ATTEMPTS: "${STATS_MAX_DELIVERY_ATTEMPTS:-3}"
      STATS_DRAIN_TIMEOUT_SECS: "${STATS_DRAIN_TIMEOUT_SECS:-60}"
      STATS_HEALTH_PORT: "8092"
      # Counts history: the append-only record behind the per-source
      # history UI. Captured inside the existing counts write (no extra
      # provider I/O); change-gated plus an hourly heartbeat so the 60s
      # probe lane does not write 43k rows/source/month. Retention is
      # purged by age AND by a per-source cap; an admin can override both
      # live in Platform settings, these are the defaults.
      INSIGHTS_HISTORY_ENABLED: "${INSIGHTS_HISTORY_ENABLED:-true}"
      INSIGHTS_HISTORY_HEARTBEAT_SECS: "${INSIGHTS_HISTORY_HEARTBEAT_SECS:-3600}"
      INSIGHTS_HISTORY_RETENTION_DAYS: "${INSIGHTS_HISTORY_RETENTION_DAYS:-90}"
      INSIGHTS_HISTORY_MAX_ROWS_PER_SOURCE: "${INSIGHTS_HISTORY_MAX_ROWS_PER_SOURCE:-5000}"
      INSIGHTS_HISTORY_PURGE_INTERVAL_SECS: "${INSIGHTS_HISTORY_PURGE_INTERVAL_SECS:-3600}"
      # Counts anomaly alerting. Evaluated by a sweep in this service (not at
      # capture time — "unusual" is a window property), delivered to the
      # in-app bell, and recorded for the admin insights API. The severity
      # floor defaults to severe: an alert that fires too eagerly gets muted.
      INSIGHTS_ALERTS_ENABLED: "${INSIGHTS_ALERTS_ENABLED:-true}"
      INSIGHTS_ALERT_MIN_SEVERITY: "${INSIGHTS_ALERT_MIN_SEVERITY:-severe}"
      INSIGHTS_ALERT_COOLDOWN_SECS: "${INSIGHTS_ALERT_COOLDOWN_SECS:-21600}"
      INSIGHTS_ALERT_INTERVAL_SECS: "${INSIGHTS_ALERT_INTERVAL_SECS:-900}"

      # Size-adaptive poll timeouts (owned by backend/app/config/resilience.py).
      STATS_POLL_TIMEOUT_SECS: "${STATS_POLL_TIMEOUT_SECS:-30}"
      STATS_POLL_TIMEOUT_LARGE_SECS: "${STATS_POLL_TIMEOUT_LARGE_SECS:-600}"
      STATS_POLL_LARGE_THRESHOLD: "${STATS_POLL_LARGE_THRESHOLD:-100000}"

      # Postgres pool sizing — the engine defaults (backend/app/db/engine.py)
      # are tuned for the web tier (~27 peak conns); a concurrency-2 worker
      # plus scheduler + admission flush fits comfortably in ~11.
      DB_JOBS_POOL_SIZE: "${STATS_DB_JOBS_POOL_SIZE:-4}"
      DB_JOBS_POOL_MAX_OVERFLOW: "${STATS_DB_JOBS_POOL_MAX_OVERFLOW:-2}"
      DB_READONLY_POOL_SIZE: "${STATS_DB_READONLY_POOL_SIZE:-3}"
      DB_READONLY_POOL_MAX_OVERFLOW: "${STATS_DB_READONLY_POOL_MAX_OVERFLOW:-2}"

      SYNODIC_ROLE: stats
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        # WS1.1 decoupling: wait only for the container to START, not for its
        # healthcheck (which requires the full dataset to finish LOADING). A
        # loading/unhealthy FalkorDB must not block the rest of the stack from
        # starting — services connect lazily and fast-fail while it warms.
        condition: service_started
      # Schema must be at head before stats-service initialises.
      upgrade:
        condition: service_completed_successfully
      # Controlplane creates aggregation-owned tables that stats reads.
      aggregation-controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Frontend (Nginx + React SPA) ──────────────────────────────────
  # Serves the built React app and reverse-proxies /api/* to viz-service.
  # (The former graph-service was retired — provider connection-testing lives
  # in viz-service, already bulkheaded; only backend/graph/adapters remains.)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3080}:80"
    depends_on:
      viz-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Demo Data Seeder (one-shot, opt-in) ───────────────────────────
  # Only runs when the "seed" profile is active:
  #   docker compose --profile seed up --build
  #
  # Generates enterprise demo scenarios (finance, ecommerce) and loads
  # them into FalkorDB. Skips if data already exists (use SEED_FORCE=true
  # to re-seed).
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile.seed
    environment:
      FALKORDB_HOST: falkordb
      # Docker reality: a provider stored with host localhost/127.0.0.1 points
      # at THIS container, not FalkorDB. Redirect any loopback host to the
      # reachable Docker service so every such provider works without
      # per-provider edits. Override (or set empty) to disable.
      FALKORDB_DOCKER_LOCALHOST_REWRITE: "${FALKORDB_DOCKER_LOCALHOST_REWRITE:-falkordb}"
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH_NAME: nexus_lineage
      SEED_SCENARIOS: finance,ecommerce       # finance | hr | marketing | ecommerce | all
      SEED_SCALE: "1"                         # 1 = ~1k nodes per scenario
      SEED_BREADTH: "1"                       # parallel system chains
      SEED_DEPTH: "1"                         # transformation layers
      # SEED_FORCE: "true"                    # uncomment to re-seed on every run
    depends_on:
      falkordb:
        # WS1.1 decoupling: wait only for the container to START, not for its
        # healthcheck (which requires the full dataset to finish LOADING). A
        # loading/unhealthy FalkorDB must not block the rest of the stack from
        # starting — services connect lazily and fast-fail while it warms.
        condition: service_started
    restart: "no"

volumes:
  falkordb_data:
  redis_data:
  postgres_data:
