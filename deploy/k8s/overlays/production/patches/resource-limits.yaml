apiVersion: apps/v1
kind: Deployment
metadata:
  name: viz-service
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: viz-service
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # One core per gunicorn worker (GUNICORN_WORKERS=4). At 2 the
              # four single-threaded async workers contend for two cores and
              # CFS-throttle under exactly the concurrent load they exist to
              # absorb — and a throttled worker's event loop stalls every
              # request on it, which reads downstream as provider slowness.
              cpu: "4"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-controlplane
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: aggregation-controlplane
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-worker
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: aggregation-worker
          # Memory is the binding constraint on a full-cube rebuild, not CPU
          # and not any store-side timeout. The accumulator is one dict entry
          # per DISTINCT rollup cell at roughly 100 bytes, and the cube grows
          # as edges x depth^2 — a few million cells is normal for a deep
          # hierarchy and costs over a gigabyte before anything else the
          # worker holds.
          #
          # The memory-aware flush (AGGREGATION_FLUSH_MEM_PCT, 60%) writes the
          # accumulator out early and keeps that bounded — but it fires only
          # INSIDE the merge loops. The end of a run builds a second full copy
          # of the key set to report and reconcile what it wrote, where no
          # flush can fire, so the peak is not the flush line. At 4Gi that
          # peak is what kills the pod, and an OOM-kill mid-run costs the
          # whole extract and compute.
          #
          # The nodes are highmem; this is cheap. Raise it before forcing a
          # full cube on a large source, not after.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: synodic
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
