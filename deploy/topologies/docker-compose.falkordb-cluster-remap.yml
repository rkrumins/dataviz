# FalkorDB Redis Cluster that ANNOUNCES UNREACHABLE ADDRESSES — the
# cross-GKE-cluster simulation. Each node runs on an internal bridge network
# and announces its bridge IP (172.28.0.x), which the host cannot route to;
# only the published 127.0.0.1:700x ports are dialable. Exactly what a client
# in a different GKE cluster sees: the slot map / MOVED redirects name pod IPs
# it cannot reach.
#
# The integration run therefore FAILS without addressRemap and passes with it:
#
#   docker compose -f deploy/topologies/docker-compose.falkordb-cluster-remap.yml up -d
#   FALKORDB_TEST_MODE=cluster \
#   FALKORDB_TEST_CLUSTER_NODES=127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002 \
#   FALKORDB_TEST_PASSWORD=testpass \
#   FALKORDB_TEST_ADDRESS_REMAP="172.28.0.10:7000=127.0.0.1:7000,172.28.0.11:7001=127.0.0.1:7001,172.28.0.12:7002=127.0.0.1:7002,172.28.0.13:7003=127.0.0.1:7003,172.28.0.14:7004=127.0.0.1:7004,172.28.0.15:7005=127.0.0.1:7005" \
#   pytest backend/tests/integration/test_topologies.py -v
x-node: &node
  image: falkordb/falkordb:v4.18.11
  restart: unless-stopped

services:
  node-0:
    <<: *node
    ports: ["7000:7000"]
    networks: {clusternet: {ipv4_address: 172.28.0.10}}
    environment:
      REDIS_ARGS: "--port 7000 --cluster-enabled yes --cluster-config-file nodes-7000.conf --cluster-node-timeout 5000 --cluster-announce-ip 172.28.0.10 --requirepass testpass --masterauth testpass --appendonly no"
  node-1:
    <<: *node
    ports: ["7001:7001"]
    networks: {clusternet: {ipv4_address: 172.28.0.11}}
    environment:
      REDIS_ARGS: "--port 7001 --cluster-enabled yes --cluster-config-file nodes-7001.conf --cluster-node-timeout 5000 --cluster-announce-ip 172.28.0.11 --requirepass testpass --masterauth testpass --appendonly no"
  node-2:
    <<: *node
    ports: ["7002:7002"]
    networks: {clusternet: {ipv4_address: 172.28.0.12}}
    environment:
      REDIS_ARGS: "--port 7002 --cluster-enabled yes --cluster-config-file nodes-7002.conf --cluster-node-timeout 5000 --cluster-announce-ip 172.28.0.12 --requirepass testpass --masterauth testpass --appendonly no"
  node-3:
    <<: *node
    ports: ["7003:7003"]
    networks: {clusternet: {ipv4_address: 172.28.0.13}}
    environment:
      REDIS_ARGS: "--port 7003 --cluster-enabled yes --cluster-config-file nodes-7003.conf --cluster-node-timeout 5000 --cluster-announce-ip 172.28.0.13 --requirepass testpass --masterauth testpass --appendonly no"
  node-4:
    <<: *node
    ports: ["7004:7004"]
    networks: {clusternet: {ipv4_address: 172.28.0.14}}
    environment:
      REDIS_ARGS: "--port 7004 --cluster-enabled yes --cluster-config-file nodes-7004.conf --cluster-node-timeout 5000 --cluster-announce-ip 172.28.0.14 --requirepass testpass --masterauth testpass --appendonly no"
  node-5:
    <<: *node
    ports: ["7005:7005"]
    networks: {clusternet: {ipv4_address: 172.28.0.15}}
    environment:
      REDIS_ARGS: "--port 7005 --cluster-enabled yes --cluster-config-file nodes-7005.conf --cluster-node-timeout 5000 --cluster-announce-ip 172.28.0.15 --requirepass testpass --masterauth testpass --appendonly no"

  # One-shot: form the cluster from INSIDE the bridge (where the announced
  # addresses are reachable).
  cluster-init:
    image: falkordb/falkordb:v4.18.11
    restart: "no"
    networks: {clusternet: {ipv4_address: 172.28.0.100}}
    depends_on: [node-0, node-1, node-2, node-3, node-4, node-5]
    command: >-
      sh -c '
      sleep 8 &&
      redis-cli -a testpass --cluster create
      172.28.0.10:7000 172.28.0.11:7001 172.28.0.12:7002
      172.28.0.13:7003 172.28.0.14:7004 172.28.0.15:7005
      --cluster-replicas 1 --cluster-yes'

networks:
  clusternet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
