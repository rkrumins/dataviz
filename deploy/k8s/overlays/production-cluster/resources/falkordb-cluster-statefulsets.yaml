# FalkorDB Redis Cluster — 3 shards × (1 master + 1 replica) = 6 pods,
# one StatefulSet per shard (INFRASTRUCTURE_LAUNCH_SCALE.md §7.1/§7.2).
# The three docs below are identical except for the shard name.
#
# Placement: dedicated tainted pool (falkordb-pool, n4-highmem-8), ONE pod
# per node (hostname anti-affinity across all cluster pods), and each
# shard's master/replica pair forced into different zones (per-shard zone
# spread) so a zone loss costs at most one side of each pair.
#
# Redis config is doc §7.2 verbatim. Two additions the doc implies but
# k8s makes explicit:
#   - cluster-announce-hostname + preferred-endpoint-type hostname:
#     gossip/MOVED carry the stable per-pod DNS name (see the headless
#     Service) instead of a pod IP that dies with every reschedule.
#   - aof-load-truncated yes: same crash-recovery stance as the base
#     single-instance StatefulSet.
#   - repl-diskless-load disabled / shutdown-on-sigterm nosave /
#     shutdown-timeout 60: see the REDIS_ARGS comment in shard-0 below.
# The claim is mounted at the image's data dir, /var/lib/falkordb/data —
# NOT /data. Mounted at /data it held only nodes.conf while the RDB, the
# appendonlydir and every temp file filled the node boot disk, and the
# kubelet evicted the pod (RESTARTS 0, no previous log, empty data dir).
# cluster-require-full-coverage no = a dead shard must not take down
# reads on the other two (the whole point of this exercise).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb-shard-0
  namespace: synodic
  labels:
    app.kubernetes.io/name: falkordb-shard-0
    app.kubernetes.io/part-of: falkordb-cluster
    app.kubernetes.io/component: graph-database
spec:
  serviceName: falkordb-cluster
  replicas: 2
  # Pods are independent Redis Cluster nodes whose identity is nodes.conf on
  # the PVC, not their ordinal. OrderedReady (the default) refuses to recreate
  # an evicted -1 until -0 is Running+Ready — an hour or more for a pod
  # replaying 15 GB, with the shard short a node the whole time.
  podManagementPolicy: Parallel
  # A fresh replica answers PONG (Ready) while the RDB is still streaming in,
  # then -LOADING for the hour it loads; a RollingUpdate takes that first PONG
  # as "done" and deletes the master next, with both copies then gone.
  # Rotations are operator-paced (README § Rotating pods): a template change
  # does nothing until a pod is deleted.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb-shard-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb-shard-0
        app.kubernetes.io/part-of: falkordb-cluster
        app.kubernetes.io/component: graph-database
    spec:
      serviceAccountName: synodic-infra
      # 120s: final AOF fsync + failover handoff on drain (doc §7.2).
      terminationGracePeriodSeconds: 120
      nodeSelector:
        dedicated: falkordb
      tolerations:
        - key: dedicated
          operator: Equal
          value: falkordb
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          # One FalkorDB pod per node, across ALL shards — the pod owns
          # the node (requests ≈ limits below).
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: falkordb-cluster
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        # THIS shard's master+replica must not share a zone.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: falkordb-shard-0
      containers:
        - name: falkordb
          image: REGISTRY/falkordb:latest
          ports:
            - containerPort: 6379
              name: falkordb
            - containerPort: 16379
              name: cluster-bus
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Module args per doc §7.2: THREAD_COUNT 6 of 8 reserves cores
            # for Redis I/O + AOF rewrite + replication; QUERY_MEM_CAPACITY
            # 1 GiB (1073741824) bounds a runaway Cypher query. 2 GiB is the
            # value the budget block below records as the BUG — at 40 GiB
            # maxmemory it needed 66.6 GiB of a 56 GiB container — so the
            # comment naming it here read as the intent rather than the
            # thing that was fixed.
            - name: FALKORDB_ARGS
              value: "THREAD_COUNT 6 OMP_THREAD_COUNT 1 CACHE_SIZE 40 QUERY_MEM_CAPACITY 1073741824 TIMEOUT_MAX 120000 TIMEOUT_DEFAULT 30000 MAX_QUEUED_QUERIES 150 EFFECTS_THRESHOLD 0"
            # Sizing, by the deployment guide's own rule (§ "Sizing: the
            # ceilings share ONE budget"). Every term is in the SAME container
            # limit, replication included:
            #   dataset        1.25 × 32 GiB                       = 40.0
            #   query memory   6 threads × 1.3 × 1 GiB             =  7.8
            #   repl backlog   repl-backlog-size 1gb               =  1.0
            #   replica bufs   2 replicas × 2 GiB hard limit       =  4.0
            #   overhead       instance ≥ 32 GiB                   =  1.0
            #                                                  total 53.8 ≤ 56
            # Two pairings that do NOT fit: 40 GiB maxmemory with a 2 GiB
            # per-query ceiling needs 66.6 GiB (the shipped values before this
            # was checked), and a 1.5 GiB ceiling needs 57.7 GiB once the
            # replication buffers below are counted. Raising those buffers is a
            # memory decision, not only a durability one.
            #
            # BEFORE APPLYING: check what each shard currently holds
            # (`redis-cli info memory | grep used_memory_human`, or Admin →
            # Graph store). A shard already above 32 GiB will refuse writes
            # the moment this lands. If one is, lower QUERY_MEM_CAPACITY or
            # THREAD_COUNT to buy the headroom back instead, or move to a
            # larger machine type — do not raise maxmemory past the formula.
            #
            # noeviction: Redis must never silently evict a graph key —
            # eviction is the app's job (GRAPHVER_FALKOR_BUDGETS, doc §7.3).
            #
            # OMP_THREAD_COUNT 1 keeps one query from spawning a thread per
            # core inside the engine; EFFECTS_THRESHOLD 0 makes every write
            # replicate as a compact change log instead of being RE-RUN on
            # each replica's main thread, which is what stopped replicas
            # answering their health probes during a large rebuild.
            #
            # FORKS (doc §5bb). BGSAVE, an AOF rewrite and a replica's full
            # resync all fork, and every page the parent writes while the child
            # lives is copied — so a fork under a rebuild's write load costs the
            # dataset twice and meets the container limit. A rebuild now HOLDS
            # its writes for the whole fork, which makes one survivable; it
            # cannot hold through one the node takes on its own schedule, hence:
            #   save 21600 1  — the RDB is a FLOOR, not the recovery path (AOF
            #     is; an RDB is read only when the appendonlydir is missing or
            #     quarantined, or across an engine upgrade, doc §5c). Its value
            #     does not decay in six hours — Cloud SQL is the source of truth
            #     for every graph — while `save 3600 1` forked this node hourly
            #     whatever else it was doing.
            #   auto-aof-rewrite-min-size 512mb — the 64 MB default rewrites a
            #     small AOF repeatedly for nothing. The PERCENTAGE stays at its
            #     default on purpose: lowering it shortens replay only in
            #     proportion (on a 13 GB base even 80% leaves 10 GB) and buys
            #     that by forking more often.
            #   replica-lazy-flush / lazyfree-lazy-server-del — a replica
            #     following a promotion or a full resync flushes what it held
            #     FIRST, and synchronously on 13 GB that is minutes of a main
            #     thread answering nothing: how a replica that was merely
            #     catching up failed its probe and was restarted in turn.
            #   repl-diskless-load disabled (the default, pinned) — the replica
            #     writes the RDB to its PVC and loads from there, so the master's
            #     fork child lives for the transfer (minutes), not for the hour
            #     an on-empty-db parse would hold it open under copy-on-write.
            #   shutdown-on-sigterm nosave — the default does a BLOCKING SAVE on
            #     SIGTERM when save points exist; on 15 GB that outlives the 120s
            #     grace and is SIGKILLed mid-save, leaving a temp-*.rdb. The AOF
            #     is fsynced first either way, so the save buys nothing here.
            #   shutdown-timeout 60 — wait (writes paused) for a lagging replica
            #     to catch up before a drain takes the master down; 60 + fsync
            #     stays inside terminationGracePeriodSeconds.
            - name: REDIS_ARGS
              value: >-
                --cluster-enabled yes
                --cluster-config-file /var/lib/falkordb/data/nodes.conf
                --cluster-node-timeout 15000
                --cluster-require-full-coverage no
                --cluster-migration-barrier 1
                --cluster-announce-hostname $(POD_NAME).falkordb-cluster.synodic.svc.cluster.local
                --cluster-preferred-endpoint-type hostname
                --maxmemory 32gb
                --maxmemory-policy noeviction
                --appendonly yes
                --appendfsync everysec
                --aof-load-truncated yes
                --auto-aof-rewrite-min-size 512mb
                --save 21600 1
                --replica-lazy-flush yes
                --lazyfree-lazy-server-del yes
                --repl-backlog-size 1gb
                --repl-diskless-sync yes
                --repl-timeout 300
                --client-output-buffer-limit replica 2gb 1gb 300
                --repl-diskless-load disabled
                --shutdown-on-sigterm nosave
                --shutdown-timeout 60
            # Probe auth: redis-cli reads REDISCLI_AUTH natively. optional +
            # empty-guarded so unauthenticated shards are unchanged; set
            # FALKORDB_PASSWORD in app-secrets when REDIS_ARGS gains
            # --requirepass/--masterauth.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FALKORDB_PASSWORD
                  optional: true
          resources:
            # requests ≈ limits — the pod owns its n4-highmem-8 node.
            requests:
              cpu: "7"
              memory: 56Gi
              # Nothing of Redis's belongs on the node disk once the claim is
              # at the data dir. A limit makes the kubelet evict THIS pod with
              # a named reason if something lands there anyway, instead of the
              # node hitting DiskPressure and evicting by its own ranking.
              ephemeral-storage: 1Gi
            limits:
              cpu: "7"
              memory: 56Gi
              ephemeral-storage: 4Gi
          startupProbe:
            # PONG only: a pod replaying its AOF answers -LOADING for as long
            # as the replay takes (an hour on a 15 GB shard). Until this
            # succeeds liveness is not evaluated, so the main thread may go
            # silent through the engine's post-load finalisation without being
            # killed into another replay. 10s × 1440 = 4h ceiling.
            exec:
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 1440
          readinessProbe:
            # Strict: -LOADING (AOF/RDB replay) and -MASTERDOWN are not
            # PONG, so a replaying or orphaned pod takes no traffic.
            # grep PONG: redis-cli exits 0 even on a NOAUTH/error reply, so
            # the bare probe stayed green while every client was rejected.
            exec:
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              # LOADING = alive and replaying — killing it restarts the
              # replay from scratch (see the base StatefulSet's history).
              command: ["sh", "-c", "[ -n \"$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; redis-cli ping 2>/dev/null | grep -qE 'PONG|LOADING'"]
            # RDB load of a full shard takes minutes (doc §7.2).
            initialDelaySeconds: 60
            periodSeconds: 10
            # A busy main thread is not a dead process. At 3s × 3 failures a
            # replica replaying a heavy write was restarted after ~30s, which
            # took its shard's availability with it. 10s × 18 gives a busy node
            # three minutes: a liveness kill costs an AOF replay plus a full
            # sync, while a dead master is already failed over by the cluster
            # at cluster-node-timeout.
            timeoutSeconds: 10
            failureThreshold: 18
          volumeMounts:
            - name: falkordb-data
              # The image's data dir (FALKORDB_DATA_PATH; run.sh passes it as
              # --dir AFTER REDIS_ARGS, so it cannot be moved from here). At
              # /data this claim held only nodes.conf — everything else lived
              # in the container's writable layer on the node boot disk.
              mountPath: /var/lib/falkordb/data
  volumeClaimTemplates:
    - metadata:
        name: falkordb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # n4 machines require Hyperdisk. 250 Gi ≈ 6× maxmemory for
        # AOF/RDB growth between rewrites (doc §7.2).
        storageClassName: hyperdisk-balanced
        resources:
          requests:
            storage: 250Gi
