# Gates the backend test suite. Before this workflow existed, the ONLY pytest
# in CI was alembic-guards.yml (two AST-only files, --noconftest) — the entire
# connectivity/provider suite never ran, and 34 of its tests were failing on
# main without anything going red.
#
# Jobs:
#   * connectivity-suite — REQUIRED. The FalkorDB/Redis/provider domain
#     (connection factory, preflight, warmup, breakers, bus/cache roles,
#     provider endpoints, aggregation/insights consumers). Green as of the
#     falkordb-redis-connectivity hardening branch; keep it green.
#   * live-engine — informational. Provider-level suites against a real FalkorDB.
#   * versioning-e2e — informational. The GRAPHVER_E2E versioned-graph suite
#     against real Postgres + FalkorDB + Redis; promote it to required once it
#     has a green track record.
#   * full-suite — informational (continue-on-error). Surfaces the remaining
#     repo-wide test debt (golden scenarios, RBAC, ontology, nav) without
#     blocking merges; promote it to required once that debt is paid down.
#
# Integration-marked tests need live services (see deploy/topologies/) and are
# excluded here via -m "not integration".
name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connectivity-suite:
    name: Backend connectivity + provider suite (required)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        # requirements-s3.txt is the OPTIONAL object-store backend: the image does not ship it,
        # but the required list holds its store tests, which skip without boto3.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt -r backend/requirements-s3.txt
      - name: Run the connectivity + provider domain suite
        working-directory: backend
        run: >-
          python -m pytest tests/ -q -m "not integration"
          -k "falkordb or preflight or warmup or circuit or redis or bus
          or provider or probes or manager or aggregation or insights"

      # The step above selects by KEYWORD, which is a denylist by omission: a
      # file whose name and test names miss every keyword is ungated, and
      # nothing goes red to say so. Measured on the graph-store branch, 681 of
      # its 1174 tests gated nothing while this job stayed green. Until
      # `full-suite` can be promoted to required, the read path is gated by
      # naming its files. `tests/test_ci_required_list.py` fails if an entry
      # stops existing, or if this step stops reading the list.
      - name: Run the graph store, view cache and capacity suites
        working-directory: backend
        run: |
          python -m pytest -q -m "not integration" \
            $(grep -vE '^\s*(#|$)' tests/ci-required-files.txt)

  live-engine:
    # THE ONLY JOB THAT RUNS AGAINST A REAL FALKORDB.
    #
    # Every other job here runs `-m "not integration"` and no workflow starts
    # an engine, so until this existed the entire rebuild pipeline was proven
    # against in-memory fakes only: our control logic, never FalkorDB's actual
    # behaviour. The live suite pins what the fakes cannot — case-fold
    # vocabulary matching against real per-label URN indexes, an unchanged
    # re-run writing NOTHING rather than wiping good edges, a resume past
    # every computed key still creating every missing pair, and the
    # `db.indexes()` shape the readiness probe reads.
    #
    # Informational to begin with, like `full-suite`: a job that gates before
    # it has a track record turns an engine hiccup into a blocked merge. Watch
    # it, then promote it to required.
    #
    # Scoped deliberately to the provider-level suite. The GRAPHVER_E2E
    # versioned-graph suite, which also needs Postgres, runs in
    # `versioning-e2e`.
    name: Live FalkorDB pipeline (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      falkordb:
        # Pinned to the version docker-compose.yml ships, so CI and the dev
        # container cannot disagree about engine behaviour.
        image: falkordb/falkordb:v4.18.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: The rebuild pipeline, against the real engine
        working-directory: backend
        env:
          RUN_FALKOR_LIVE: "1"
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
        run: |
          python -m pytest tests/integration/test_aggregation_pipeline_live.py -q
      # Typed property comparisons: the compiled Cypher must pick exactly
      # the entities the Python reference evaluator does, on every stored
      # kind — the engine quirks it works around are version-specific.
      # The uncapped engine: its chunked, paged answer must equal one
      # uncapped ORDER BY, row for row, under every scope shape — and a
      # property kept raw (propertiesRaw) must be searched as exactly as one
      # kept natively. An export of a search's matches must hold each one
      # once, every value exactly as the graph keeps it. Run whatever the
      # rebuild pipeline step above did: its result says nothing about these.
      - name: Search comparison semantics and the uncapped engine, against the real engine
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          RUN_FALKOR_LIVE: "1"
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
        run: |
          python -m pytest tests/integration/test_search_semantics_live.py \
            tests/integration/test_search_engine_live.py \
            tests/integration/test_raw_properties_live.py \
            tests/integration/test_search_export_live.py -q

  versioning-e2e:
    # The versioned graph against real Postgres, FalkorDB and Redis.
    #
    # About a hundred GRAPHVER_E2E files hold the only proof of the versioned
    # graph's guarantees: no lost update, OCC, rebase, publish, projection and
    # the bootstrap of a customer's graph. Until this job existed every other
    # job skipped them, so a change could break any of them with a green build.
    #
    # The files are named in tests/ci-versioning-e2e-files.txt, and
    # tests/test_ci_required_list.py fails if a GRAPHVER_E2E file is neither
    # listed there nor excused. A test that fails because of a known defect is
    # marked xfail(strict=True) with its finding id, so the fix turns it red
    # until the marker goes.
    #
    # Informational until it has a track record, like live-engine.
    name: Versioned graph against Postgres + FalkorDB (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: synodic
          POSTGRES_PASSWORD: synodic
          POSTGRES_DB: synodic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synodic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      falkordb:
        image: falkordb/falkordb:v4.18.11
        env:
          # The image's own FALKORDB_ARGS less its RESULTSET_SIZE 10000, which cuts every
          # reply at 10,000 rows without an error. Every FALKORDB_ARGS this repo deploys
          # leaves it unlimited, and the bootstrap refuses a capped server.
          FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE -1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # The coordination bus. Its default port is 6380, because 6379 is
        # FalkorDB here (redis_endpoint.py).
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GRAPHVER_E2E: "1"
      RUN_FALKOR_LIVE: "1"
      MANAGEMENT_DB_URL: postgresql+asyncpg://synodic:synodic@localhost:5432/synodic
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Build the management and graphver schemas
        # Most E2E files create the graphver schema themselves; building it
        # once here keeps the few that do not from depending on test order.
        # The app's own caller is backend/app/services/versioning/__main__.py.
        run: |
          python -m backend.scripts.upgrade upgrade
          python -c "import asyncio; from backend.app.services.versioning import models; asyncio.run(models.create_schema_and_partitions())"
      - name: Run the versioned-graph suite
        working-directory: backend
        run: |
          python -m pytest -q -ra $(grep -vE '^\s*(#|$)' tests/ci-versioning-e2e-files.txt)

  full-suite:
    name: Full backend suite (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run the full unit suite
        working-directory: backend
        run: python -m pytest tests/ -q -m "not integration"
