# What the SPA document's Content-Security-Policy allows the page to fetch
# BEYOND its own origin — appended to ``connect-src 'self'`` in default.conf.
#
# Empty as shipped, so the policy is byte-for-byte ``connect-src 'self'``.
# At container start /docker-entrypoint.d/40-csp-connect-src.sh overwrites
# this file from CSP_CONNECT_SRC when that is set, so configure the
# variable rather than editing this.
map $host $csp_connect_extra {
    default "";
}
