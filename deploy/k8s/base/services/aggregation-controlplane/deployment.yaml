apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-controlplane
  namespace: synodic
  labels:
    app.kubernetes.io/name: aggregation-controlplane
    app.kubernetes.io/component: controlplane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aggregation-controlplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aggregation-controlplane
        app.kubernetes.io/component: controlplane
    spec:
      serviceAccountName: synodic-backend
      terminationGracePeriodSeconds: 30
      # No init gates: postgres/redis are managed endpoints in production (the
      # in-cluster Services are deleted by the managed-data-tier patch, so an
      # nc -z against those names deadlocks every rescheduled pod in Init), and
      # FalkorDB is connected lazily with fast-fail (WS1.1). The backend retries
      # the DB at startup; the startup probe budget covers migrations.
      containers:
        - name: aggregation-controlplane
          image: REGISTRY/aggregation-controlplane:latest
          ports:
            - containerPort: 8091
              name: http
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: controlplane-config
          env:
            - name: MANAGEMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MANAGEMENT_DB_URL
            # WS2.3: internal-auth shared secret. optional:true so a missing
            # key never blocks startup — the control plane then runs with
            # auth disabled (still functional), exactly like an unset dev
            # token. Set the key in app-secrets to enforce.
            - name: AGGREGATION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AGGREGATION_INTERNAL_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
