version: "3.9"

# Test-only services. Bring up just the one(s) you need:
#
#     docker compose -f docker-compose.test.yml up -d spanner-emulator
#
# After the emulator is healthy, bootstrap an instance + database:
#
#     export SPANNER_EMULATOR_HOST=localhost:9010
#     gcloud config configurations create emulator
#     gcloud config set auth/disable_credentials true
#     gcloud config set project test-project
#     gcloud config set api_endpoint_overrides/spanner http://localhost:9020/
#     gcloud spanner instances create test-instance \
#         --config=emulator-config --description="Test" --nodes=1
#     gcloud spanner databases create "test_db_$$" --instance=test-instance \
#         --ddl="CREATE TABLE _bootstrap (id INT64 NOT NULL) PRIMARY KEY (id)"
#
# Then:
#     pytest backend/tests/test_spanner_provider_emulator.py -v
#
# Note: the emulator does NOT support Spanner Graph (CREATE PROPERTY GRAPH / GQL).
# The emulator suite covers SQL paths only; for GQL, point
# ``SPANNER_TEST_INSTANCE`` at a real Enterprise-edition database and run
# backend/tests/integration/test_spanner_provider_real.py.

services:
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    container_name: synodic-spanner-emulator
    ports:
      - "9010:9010"   # gRPC
      - "9020:9020"   # REST
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9010"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Versioned-graph integration tests (real Postgres + real FalkorDB):
  #
  #     docker compose -f docker-compose.test.yml up -d falkordb postgres
  #     export GRAPHVER_E2E=1 FALKORDB_HOST=localhost FALKORDB_PORT=6379 \
  #            MANAGEMENT_DB_URL=postgresql+asyncpg://synodic:synodic@localhost:5432/synodic
  #     pytest backend/tests/integration/test_versioning_falkor_live.py -v -m integration
  #
  # Where image pulls are blocked, run FalkorDB by loading the released module
  # into a redis-server 8.0+ (the module requires redis 8):
  #
  #     curl -sSL -o /tmp/falkordb.so \
  #       https://github.com/FalkorDB/FalkorDB/releases/download/v4.18.8/falkordb-x64.so
  #     chmod +x /tmp/falkordb.so
  #     redis-server --port 6379 --loadmodule /tmp/falkordb.so
  falkordb:
    image: falkordb/falkordb:latest
    container_name: synodic-test-falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    environment:
      FALKORDB_ARGS: THREAD_COUNT 4 OMP_THREAD_COUNT 1 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 180000 MAX_QUEUED_QUERIES 64 QUERY_MEM_CAPACITY 536870912 CACHE_SIZE 50
      # Instance-level memory ceiling: QUERY_MEM_CAPACITY bounds ONE query;
      # without maxmemory the dataset itself can still OOM-kill the container.
      # noeviction = writes fail loudly at the ceiling instead of silent eviction.
      REDIS_ARGS: --maxmemory ${FALKORDB_MAXMEMORY:-2gb} --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --aof-load-truncated yes
    healthcheck:
      # LOADING = alive and replaying AOF/RDB — see docker-compose.yml.
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|LOADING'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: synodic-test-postgres
    environment:
      POSTGRES_USER: synodic
      POSTGRES_PASSWORD: synodic
      POSTGRES_DB: synodic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synodic"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
