# Gates the backend test suite. Before this workflow existed, the ONLY pytest
# in CI was alembic-guards.yml (two AST-only files, --noconftest) — the entire
# connectivity/provider suite never ran, and 34 of its tests were failing on
# main without anything going red.
#
# Two jobs:
#   * connectivity-suite — REQUIRED. The FalkorDB/Redis/provider domain
#     (connection factory, preflight, warmup, breakers, bus/cache roles,
#     provider endpoints, aggregation/insights consumers). Green as of the
#     falkordb-redis-connectivity hardening branch; keep it green.
#   * full-suite — informational (continue-on-error). Surfaces the remaining
#     repo-wide test debt (golden scenarios, RBAC, ontology, nav) without
#     blocking merges; promote it to required once that debt is paid down.
#
# Integration-marked tests need live services (see deploy/topologies/) and are
# excluded here via -m "not integration".
name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connectivity-suite:
    name: Backend connectivity + provider suite (required)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Without a live FalkorDB, tests/regression/test_falkordb_provider_contract.py
    # SKIPS — silently, and it is the only test in the repo that pins what the
    # provider RETURNS rather than what Cypher it emits (31 stored snapshots).
    # Everything else here is fake-driven: a method could return a different
    # shape and every other test would still pass. Its gate is inside the test,
    # in `_runner.make_contract_test`: FALKORDB_HOST must be set AND host:port
    # must accept a TCP connection, both checked when the test runs. The
    # health-check options below are what make that connection succeed on the
    # first attempt rather than racing a still-starting container.
    services:
      falkordb:
        # Same pin as docker-compose.yml's falkordb service. Never :latest —
        # an engine upgrade must be a deliberate, reviewable change, not
        # something a CI run picks up on its own.
        image: falkordb/falkordb:v4.18.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s
    env:
      # LOAD-BEARING, not decorative — do not delete. FALKORDB_HOST has no
      # default: `make_contract_test` calls pytest.skip() outright when
      # <PREFIX>_HOST is unset, so removing these two lines puts CI straight
      # back into the silent-skip state the service block above exists to
      # prevent. (FALKORDB_PORT alone would fall back to the descriptor's
      # default_port, 6379; it is stated so the pair reads as one setting.)
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
      # The contract test skips itself two ways (`_runner.make_contract_test`):
      # FALKORDB_HOST unset, or host:port refusing a TCP connection. Either one
      # makes it SKIP and the job still goes green — the failure mode the
      # service block above exists to remove would simply come back quietly.
      # Fail here instead, checking both halves, with a message that says which
      # one is actually missing.
      - name: Verify the contract test will run (it skips silently otherwise)
        run: |
          python - <<'PY'
          import os, sys, redis
          host = os.getenv("FALKORDB_HOST")
          if not host:
              sys.exit(
                  "FALKORDB_HOST is unset. make_contract_test skips outright "
                  "without it — there is no default. Restore the job's env: "
                  "block rather than letting the contract test skip."
              )
          port = int(os.getenv("FALKORDB_PORT") or 6379)
          try:
              redis.Redis(host=host, port=port, socket_connect_timeout=5).ping()
          except Exception as exc:
              sys.exit(
                  f"FalkorDB unreachable on {host}:{port} ({exc}). The provider "
                  "contract test would SKIP and this job would pass without "
                  "running the only check that pins what the provider RETURNS. "
                  "Fix the service block rather than letting it skip."
              )
          print(f"FalkorDB reachable on {host}:{port} — the contract test will run, not skip.")
          PY

      - name: Run the connectivity + provider domain suite
        working-directory: backend
        run: >-
          python -m pytest tests/ -q -m "not integration"
          -k "falkordb or preflight or warmup or circuit or redis or bus
          or provider or probes or manager or aggregation or insights"

  full-suite:
    name: Full backend suite (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run the full unit suite
        working-directory: backend
        run: python -m pytest tests/ -q -m "not integration"
