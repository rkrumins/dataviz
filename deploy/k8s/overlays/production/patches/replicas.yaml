apiVersion: apps/v1
kind: Deployment
metadata:
  name: viz-service
  namespace: synodic
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-worker
  namespace: synodic
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: synodic
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-controlplane
  namespace: synodic
spec:
  # HA: 2 replicas removes the single-pod SPOF during GKE rebalancing. Safe
  # because every control-plane loop is HA-safe — state-sync (consumer group),
  # reconciler (Postgres advisory xact lock), scheduler (idempotent signals;
  # no lock, so its retry breaker may count a retry twice — it trips one
  # retry early, never late), crash-recovery (per-job exec-lock dedup plus
  # the shared auto-resume cap), outbox relay (FOR UPDATE SKIP LOCKED
  # batches), retention sweeps (advisory xact lock per batch), analytics
  # warmer (one Redis claim per epoch).
  replicas: 2
