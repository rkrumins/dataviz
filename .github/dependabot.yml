# Dependabot version-updates — scheduled freshness PRs.
#
# Complements the repo's Dependabot *security* updates (enabled in the GitHub
# UI, which only open PRs when a dependency has a known vulnerability). This
# config adds weekly freshness PRs for dependencies that security-updates won't
# proactively bump — most usefully the Docker base images and GitHub Actions.
#
# Minor + patch bumps are grouped into one PR per ecosystem to keep noise low;
# majors still open individually so they can be reviewed on their own.
version: 2
updates:
  # ── Frontends (npm) ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      landing-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Backend (pip) — bumps the requirements.txt floors ────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Docker base images (FROM lines) ──────────────────────────────────
  # One entry per directory containing Dockerfiles. Dependabot's docker
  # ecosystem parses FROM lines only; compose / k8s / Helm image refs are
  # kept in sync manually + guarded by the Trivy config scan in CI.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /landing
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /data/quickstart
    schedule:
      interval: weekly

  # ── GitHub Actions (kept SHA-pinned; Dependabot bumps sha + comment) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
