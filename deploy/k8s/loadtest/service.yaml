apiVersion: v1
kind: Service
metadata:
  name: loadtest-master
  namespace: synodic
  labels:
    app.kubernetes.io/name: loadtest-master
    app.kubernetes.io/part-of: loadtest
spec:
  # ClusterIP, and deliberately not a LoadBalancer or a NodePort: the web UI
  # can start a load test, so it is reachable by port-forward only.
  #
  #   kubectl -n synodic port-forward svc/loadtest-master 8089:8089
  type: ClusterIP
  ports:
    - port: 5557
      targetPort: worker
      name: worker
    - port: 8089
      targetPort: web
      name: web
  selector:
    app.kubernetes.io/name: loadtest-master
