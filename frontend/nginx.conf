# Keepalive connection pools to the API upstreams. Without these (and the
# ``Connection ""`` header + HTTP/1.1 below) nginx opened a FRESH upstream
# TCP connection per proxied request and closed it after — pure churn under
# the canvas's request bursts. A warm pool removes the per-request connect
# handshake to the backend. (This does NOT change the browser<->nginx side;
# that 6-connection HTTP/1.1 limit is addressed by HTTP/2 at the TLS edge in
# prod — see deploy/k8s ingress — and by the WS5/WS6 request-count collapse.)
upstream viz_backend {
    server viz-service:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    # Level 6 matches the app's own ORJSON/gzip middleware — the default
    # level 1 barely compressed the large aggregated/trace JSON payloads.
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ── Liveness probe (nginx is up) — Docker HEALTHCHECK / K8s liveness
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"frontend"}';
        add_header Content-Type application/json;
    }

    # ── Readiness probe — checks that backend is reachable (K8s readiness)
    location = /readyz {
        access_log off;
        proxy_pass         http://viz-service:8000/health;
        proxy_read_timeout 3s;
        proxy_connect_timeout 2s;
    }

    # ── Visualization Service API docs (/openapi.json, /docs, /redoc) ─
    location = /openapi.json {
        proxy_pass         http://viz-service:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /viz-docs {
        proxy_pass         http://viz-service:8000/docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /viz-redoc {
        proxy_pass         http://viz-service:8000/redoc;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Visualization Service API (/api/*) ────────────────────────────
    location /api/ {
        proxy_pass         http://viz_backend;
        proxy_http_version 1.1;
        # Required for upstream keepalive to actually pool: clear the
        # per-request Connection header so nginx reuses the pooled conn.
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Bulk import/export uploads were 413ing at the nginx default of
        # 1m; endpoints with stricter app-level caps (e.g. branding logo
        # upload) still enforce their own limits.
        client_max_body_size  100m;
        # Fail fast when the upstream is down instead of the 60s default.
        proxy_connect_timeout 5s;
        # Margin over the backend's slowest ASGI tier (versioning, 120s)
        # so the app's timeout — with its clean JSON 504 — always wins
        # the race, never an opaque nginx 504.
        proxy_read_timeout    180s;
    }

    # ── Frontend SPA — client-side routing fallback ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
